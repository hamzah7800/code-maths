<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Parkour Game</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    // Get the canvas
    const canvas = document.getElementById("renderCanvas");

    // Create BabylonJS engine
    const engine = new BABYLON.Engine(canvas, true);

    // Create scene
    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.1);

      // Camera
      const camera = new BABYLON.FollowCamera("followCam", new BABYLON.Vector3(0, 2, -10), scene);
      camera.radius = 10;
      camera.heightOffset = 3;
      camera.rotationOffset = 0;
      camera.cameraAcceleration = 0.05;
      camera.maxCameraSpeed = 20;

      // Light
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      // Player
      const player = BABYLON.MeshBuilder.CreateBox("player", {size:1}, scene);
      player.position.y = 1;
      player.position.z = 0;
      player.checkCollisions = true;

      // Physics
      scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), new BABYLON.CannonJSPlugin());

      // Player Physics Impostor
      player.physicsImpostor = new BABYLON.PhysicsImpostor(player, BABYLON.PhysicsImpostor.BoxImpostor, { mass:1, restitution:0 }, scene);

      // Platforms
      const platforms = [];
      for(let i=0; i<20; i++){
        const platform = BABYLON.MeshBuilder.CreateBox("platform"+i, {width:3, height:0.5, depth:3}, scene);
        platform.position.y = 0;
        platform.position.x = (Math.random()-0.5) * 10;
        platform.position.z = i*5;
        platform.checkCollisions = true;
        platform.physicsImpostor = new BABYLON.PhysicsImpostor(platform, BABYLON.PhysicsImpostor.BoxImpostor, { mass:0, restitution:0 }, scene);
        platforms.push(platform);
      }

      // Make camera follow player
      camera.lockedTarget = player;

      // Keyboard controls
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, function(evt){ inputMap[evt.sourceEvent.key] = true; }));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, function(evt){ inputMap[evt.sourceEvent.key] = false; }));

      // Movement parameters
      const speed = 0.2;
      const jumpForce = 5;
      let canJump = true;

      scene.onBeforeRenderObservable.add(() => {
        let forward = new BABYLON.Vector3(0,0,1);
        let right = new BABYLON.Vector3(1,0,0);

        if(inputMap["w"] || inputMap["ArrowUp"]) player.physicsImpostor.applyImpulse(forward.scale(speed), player.getAbsolutePosition());
        if(inputMap["s"] || inputMap["ArrowDown"]) player.physicsImpostor.applyImpulse(forward.scale(-speed), player.getAbsolutePosition());
        if(inputMap["a"] || inputMap["ArrowLeft"]) player.physicsImpostor.applyImpulse(right.scale(-speed), player.getAbsolutePosition());
        if(inputMap["d"] || inputMap["ArrowRight"]) player.physicsImpostor.applyImpulse(right.scale(speed), player.getAbsolutePosition());

        if((inputMap[" "] || inputMap["Space"]) && canJump){
          player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,jumpForce,0), player.getAbsolutePosition());
          canJump = false;
        }

        // Reset jump if on a platform
        platforms.forEach(platform => {
          if(player.intersectsMesh(platform, false) && player.position.y - platform.position.y <= 1.1){
            canJump = true;
          }
        });
      });

      return scene;
    }

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
