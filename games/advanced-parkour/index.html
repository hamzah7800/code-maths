<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Infinite Parkour Runner - With Power-ups</title>
<style>
  body, html { margin: 0; overflow: hidden; background: #20232a; font-family: Arial, sans-serif; }
  #score {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    user-select: none;
    z-index: 10;
  }
  #fuelBarContainer {
    position: fixed;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 20px;
    border: 2px solid white;
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    z-index: 11;
  }
  #fuelBar {
    height: 100%;
    width: 100%;
    background: #0a0;
  }
  #gameOverScreen {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 40px;
    font-size: 32px;
    border-radius: 10px;
    display: none;
    z-index: 20;
    text-align: center;
  }
  #restartBtn {
    margin-top: 20px;
    background: #0a0;
    border: none;
    padding: 12px 24px;
    font-size: 24px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
  }
  #ui {
    position: fixed;
    bottom: 15px;
    left: 15px;
    width: 140px;
    height: 140px;
    pointer-events: none;
    z-index: 15;
  }
  #joystick {
    width: 140px;
    height: 140px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    position: relative;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
  }
  #stick {
    width: 80px;
    height: 80px;
    background: #ccc;
    border-radius: 50%;
    position: absolute;
    left: 30px;
    top: 30px;
    pointer-events: none;
  }
  #jumpBtn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 90px;
    height: 90px;
    background: #0a0;
    border-radius: 50%;
    font-size: 28px;
    text-align: center;
    line-height: 90px;
    user-select: none;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="fuelBarContainer"><div id="fuelBar"></div></div>

<div id="gameOverScreen">
  <div>You Died!<br/>Score: <span id="finalScore">0</span></div>
  <button id="restartBtn">Restart</button>
</div>

<div id="ui">
  <div id="joystick"><div id="stick"></div></div>
</div>
<div id="jumpBtn">Jump</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
(() => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x20232a);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 7, 15);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(0, 15, 15);
  scene.add(dirLight);

  // Player cube
  const playerSize = 1.5;
  const playerGeometry = new THREE.BoxGeometry(playerSize, playerSize * 2, playerSize);
  const playerMaterial = new THREE.MeshStandardMaterial({color: 0x00ff00});
  const player = new THREE.Mesh(playerGeometry, playerMaterial);
  player.position.set(0, playerSize, 0);
  scene.add(player);

  // Floor/platforms
  const platformWidth = 6;
  const platformDepth = 10;
  const platformHeight = 0.6;
  const platforms = [];

  // Materials for platforms & traps
  const normalMat = new THREE.MeshStandardMaterial({color: 0x555555});
  const spikeMat = new THREE.MeshStandardMaterial({color: 0xff4444});
  const lavaMat = new THREE.MeshStandardMaterial({color: 0xffa500});
  const powerupMat = new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.7});

  // Game variables
  let forwardSpeed = 0.22;
  let lateralSpeed = 0.15;
  let jumpSpeed = 0.33;
  let gravity = 0.015;
  let velocityY = 0;
  let onGround = true;
  let jumpCount = 0;
  const maxJumps = 3; // triple jump
  let flying = false;
  const maxFuel = 100;
  let fuel = maxFuel;
  const fuelConsumption = 0.8;
  const fuelRecovery = 0.4;

  // Speed boost power-up
  let speedBoostActive = false;
  let speedBoostTimer = 0;
  const speedBoostDuration = 300; // frames (~5 seconds)

  // Controls variables
  let moveX = 0; // -1 left, 0 none, 1 right
  let jumpPressed = false;

  // Score and distance
  let distance = 0;

  // Camera follow offset
  const camOffset = new THREE.Vector3(0, 7, 15);

  // UI elements
  const scoreEl = document.getElementById('score');
  const fuelBar = document.getElementById('fuelBar');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');
  const joystick = document.getElementById('joystick');
  const stick = document.getElementById('stick');
  const jumpBtn = document.getElementById('jumpBtn');

  // Joystick vars
  const joystickCenter = {x: 70, y: 70};
  let joystickActive = false;
  let joystickPos = {x: 70, y: 70};
  let joystickMaxRadius = 55;

  // Power-up objects storage
  const powerups = [];

  // Initialize platforms forward
  let platformZ = 0;
  function createPlatform(z, type='normal', x=0) {
    const geometry = new THREE.BoxGeometry(platformWidth, platformHeight, platformDepth);
    let material = normalMat;
    if(type === 'spike') material = spikeMat;
    else if(type === 'lava') material = lavaMat;

    const platform = new THREE.Mesh(geometry, material);
    platform.position.set(x, 0, z);
    platform.userData.type = type;
    scene.add(platform);
    platforms.push(platform);
  }

  for(let i=0; i<15; i++) createPlatform(i * -platformDepth);

  // Create a power-up at given position
  function createPowerup(x, z) {
    const geometry = new THREE.OctahedronGeometry(0.8, 0);
    const powerup = new THREE.Mesh(geometry, powerupMat);
    powerup.position.set(x, 1.5, z);
    powerup.userData.type = 'powerup';
    scene.add(powerup);
    powerups.push(powerup);
  }

  // Randomly add trap platforms and sometimes powerups
  function addNextPlatform() {
    platformZ -= platformDepth;
    const trapChance = Math.random();
    let type = 'normal';
    if (trapChance < 0.25) type = 'spike';
    else if (trapChance < 0.45) type = 'lava';

    // Random X: -platformWidth, 0, or +platformWidth (3 lanes)
    const laneX = [-platformWidth, 0, platformWidth][Math.floor(Math.random() * 3)];

    createPlatform(platformZ, type, laneX);

    // 20% chance to spawn powerup on a normal platform (not on traps)
    if(type === 'normal' && Math.random() < 0.2) {
      // Spawn powerup in random lane, but not same lane as platform
      let puLaneX = laneX;
      while (puLaneX === laneX) {
        puLaneX = [-platformWidth, 0, platformWidth][Math.floor(Math.random() * 3)];
      }
      createPowerup(puLaneX, platformZ);
    }
  }

  // Remove old platforms far behind
  function cleanupPlatforms() {
    for(let i=platforms.length-1; i>=0; i--) {
      if(platforms[i].position.z > player.position.z + 20) {
        scene.remove(platforms[i]);
        platforms.splice(i,1);
      }
    }
    for(let i=powerups.length-1; i>=0; i--) {
      if(powerups[i].position.z > player.position.z + 20) {
        scene.remove(powerups[i]);
        powerups.splice(i,1);
      }
    }
  }

  // Collision detection between player and platforms/traps/powerups (simple AABB)
  function checkCollision(obj) {
    const pMin = {
      x: player.position.x - playerSize/2,
      y: player.position.y - playerSize,
      z: player.position.z - playerSize/2
    };
    const pMax = {
      x: player.position.x + playerSize/2,
      y: player.position.y + playerSize,
      z: player.position.z + playerSize/2
    };

    const oMin = {
