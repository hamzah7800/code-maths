<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Parkour Runner - Clean Version</title>
  <style>
    body, html { margin: 0; overflow: hidden; background: #20232a; font-family: Arial, sans-serif; }
    #score { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); color: white; font-size: 28px; font-weight: bold; z-index:10; }
    #fuelBarContainer { position: fixed; top: 50px; left:50%; transform:translateX(-50%); width:200px; height:20px; border:2px solid white; border-radius:10px; overflow:hidden; z-index:11; }
    #fuelBar { height:100%; width:100%; background:#0a0; }
    #gameOverScreen { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%); background:rgba(0,0,0,0.8);color:white;padding:40px;font-size:32px;border-radius:10px;display:none;z-index:20;text-align:center; }
    #restartBtn { margin-top:20px;background:#0a0;border:none;padding:12px 24px;font-size:24px;border-radius:8px;cursor:pointer;color:white; }
    #ui { position:fixed; bottom:15px; left:15px; width:140px; height:140px; pointer-events:none; z-index:15; }
    #joystick { width:140px;height:140px;background:rgba(255,255,255,0.1);border-radius:50%;pointer-events:auto;touch-action:none; }
    #stick { width:80px;height:80px;background:#ccc;border-radius:50%;position:absolute;left:30px;top:30px;pointer-events:none; }
    #jumpBtn { position:fixed; bottom:25px; right:25px; width:90px; height:90px; background:#0a0; border-radius:50%; font-size:28px; text-align:center; line-height:90px; pointer-events:auto; touch-action:manipulation; cursor:pointer; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="fuelBarContainer"><div id="fuelBar"></div></div>
  <div id="gameOverScreen"><div>You Died!<br/>Score: <span id="finalScore">0</span></div><button id="restartBtn">Restart</button></div>
  <div id="ui"><div id="joystick"><div id="stick"></div></div></div>
  <div id="jumpBtn">Jump</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script>
  (() => {
    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x20232a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 7, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);
    const directional = new THREE.DirectionalLight(0xffffff, 0.6);
    directional.position.set(0, 15, 15);
    scene.add(directional);

    // --- Materials & Geometry ---
    const playerSize = 1.5;
    const playerGeo = new THREE.BoxGeometry(playerSize, playerSize * 2, playerSize);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, playerSize, 0);
    scene.add(player);

    const platformW = 6, platformD = 10, platformH = 0.6;
    const platforms = [];

    const nm = new THREE.MeshStandardMaterial({ color: 0x555555 }); // Normal
    const sm = new THREE.MeshStandardMaterial({ color: 0x990000 }); // Spike
    const lm = new THREE.MeshStandardMaterial({ color: 0xff3300 }); // Lava

    // --- Game Variables ---
    let forwardSpeed = 0.22, lateralSpeed = 0.15, jumpSpeed = 0.33, gravity = 0.015;
    let velocityY = 0, onGround = true, jumpCount = 0, maxJumps = 3, flying = false;
    const maxFuel = 100, fuelConsumption = 0.8, fuelRecovery = 0.4;
    let fuel = maxFuel, moveX = 0, jumpPressed = false;
    let distance = 0, platformZ = 0, dead = false;

    // --- UI Elements ---
    const scoreEl = document.getElementById('score');
    const fuelBar = document.getElementById('fuelBar');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    const jumpBtn = document.getElementById('jumpBtn');

    // --- Joystick Setup ---
    const joystickCenter = { x: 70, y: 70 };
    const joystickMax = 55;
    let joystickActive = false;

    function createPlatform(z, type = 'normal', x = 0) {
      const geo = new THREE.BoxGeometry(platformW, platformH, platformD);
      const mat = type === 'spike' ? sm : type === 'lava' ? lm : nm;
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0, z);
      mesh.userData.type = type;
      scene.add(mesh);
      platforms.push(mesh);
    }

    for (let i = 0; i < 15; i++) createPlatform(i * -platformD);

    function addPlatform() {
      platformZ -= platformD;
      const trapChance = Math.random();
      const type = trapChance < 0.25 ? 'spike' : trapChance < 0.45 ? 'lava' : 'normal';
      const lane = [-platformW, 0, platformW][Math.floor(Math.random() * 3)];
      createPlatform(platformZ, type, lane);
    }

    function cleanupPlatforms() {
      for (let i = platforms.length - 1; i >= 0; i--) {
        if (platforms[i].position.z > player.position.z + 20) {
          scene.remove(platforms[i]);
          platforms.splice(i, 1);
        }
      }
    }

    function checkTrapContact() {
      return platforms.some(p => {
        const dx = Math.abs(p.position.x - player.position.x);
        const dz = Math.abs(p.position.z - player.position.z);
        const dy = player.position.y - platformH / 2;
        return dx < platformW / 1.8 &&
               dz < platformD / 1.8 &&
               dy < platformH + 0.6 &&
               (p.userData.type === 'spike' || p.userData.type === 'lava');
      });
    }

    function triggerJump() {
      if (onGround) {
        velocityY = jumpSpeed;
        onGround = false;
        jumpCount = 1;
        animateJump();
      } else if (jumpCount < maxJumps) {
        velocityY = jumpSpeed;
        jumpCount++;
        animateJump();
      }
      jumpPressed = true;
    }

    function animateJump() {
      new TWEEN.Tween(player.scale)
        .to({ y: 1.2, x: 0.8, z: 0.8 }, 100)
        .yoyo(true).repeat(1).start();
    }

    function handleFlying() {
      if (!onGround && jumpPressed && fuel > 0) {
        flying = true;
        velocityY = jumpSpeed * 0.6;
        fuel = Math.max(fuel - fuelConsumption, 0);
      } else flying = false;
    }

    // --- Input Handling ---
    joystick.addEventListener('touchstart', e => { e.preventDefault(); joystickActive = true; });
    joystick.addEventListener('touchmove', e => {
      if (!joystickActive) return;
      e.preventDefault();
      const touch = e.touches[0];
      const rect = joystick.getBoundingClientRect();
      let dx = touch.clientX - rect.left - joystickCenter.x;
      let dy = touch.clientY - rect.top - joystickCenter.y;
      const dist = Math.min(Math.hypot(dx, dy), joystickMax);
      const angle = Math.atan2(dy, dx);
      const lx = joystickCenter.x + Math.cos(angle) * dist;
      stick.style.left = (lx - stick.offsetWidth / 2) + 'px';
      const moveThreshold = dx < -15 ? -1 : dx > 15 ? 1 : 0;
      moveX = moveThreshold;
    });
    joystick.addEventListener('touchend', () => { joystickActive = false; moveX = 0; stick.style.left = joystickCenter.x - stick.offsetWidth / 2 + 'px'; });
    jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); triggerJump(); });
    jumpBtn.addEventListener('touchend', () => { jumpPressed = false; });

    restartBtn.onclick = () => {
      player.position.set(0, playerSize, 0);
      velocityY = 0;
      onGround = true;
      jumpCount = 0;
      moveX = 0;
      distance = 0;
      platformZ = 0;
      fuel = maxFuel;
      dead = false;
      scoreEl.textContent = 'Score: 0';
      fuelBar.style.width = '100%';
      gameOverScreen.style.display = 'none';
      platforms.forEach(p => scene.remove(p));
      platforms.length = 0;
      for (let i = 0; i < 15; i++) createPlatform(i * -platformD);
    };

    // --- Game Loop ---
    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();
      if (!dead) {
        player.position.z -= forwardSpeed;
        player.position.x += moveX * lateralSpeed;
        player.position.x = Math.max(-platformW, Math.min(platformW, player.position.x));
        handleFlying();
        if (!flying) velocityY -= gravity;
        player.position.y += velocityY;
        if (player.position.y <= playerSize) {
          player.position.y = playerSize;
          velocityY = 0;
          onGround = true;
          jumpCount = 0;
          fuel = Math.min(fuel + fuelRecovery, maxFuel);
        }

        while (platformZ > player.position.z - platformD * 15) addPlatform();
        cleanupPlatforms();

        camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y + 5, player.position.z + 15), 0.1);
        camera.lookAt(player.position);
        distance += forwardSpeed * 1.5;
        scoreEl.textContent = 'Score: ' + Math.floor(distance);
        fuelBar.style.width = (fuel / maxFuel * 100) + '%';

        if (player.position.y < -8 || checkTrapContact()) {
          dead = true;
          finalScoreEl.textContent = Math.floor(distance);
          gameOverScreen.style.display = 'block';
        }

        forwardSpeed = Math.min(0.5, forwardSpeed + 0.00005);
        lateralSpeed = Math.min(0.3, lateralSpeed + 0.00003);
        jumpSpeed = Math.min(0.5, jumpSpeed + 0.00002);
      }

      TWEEN.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>
