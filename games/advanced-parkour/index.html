<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Infinite Parkour Runner</title>
<style>
  body, html { margin: 0; overflow: hidden; background: #20232a; font-family: Arial, sans-serif; }
  #score {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    user-select: none;
    z-index: 10;
  }
  #gameOverScreen {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 40px;
    font-size: 32px;
    border-radius: 10px;
    display: none;
    z-index: 20;
    text-align: center;
  }
  #restartBtn {
    margin-top: 20px;
    background: #0a0;
    border: none;
    padding: 12px 24px;
    font-size: 24px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
  }
  #ui {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    padding: 0 15px;
    pointer-events: none;
    z-index: 15;
  }
  #joystick {
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    position: relative;
    pointer-events: auto;
    touch-action: none;
  }
  #stick {
    width: 60px;
    height: 60px;
    background: #ccc;
    border-radius: 50%;
    position: absolute;
    left: 30px;
    top: 30px;
    pointer-events: none;
  }
  #jumpBtn {
    width: 80px;
    height: 80px;
    background: #0a0;
    border-radius: 50%;
    font-size: 24px;
    text-align: center;
    line-height: 80px;
    user-select: none;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
    user-select: none;
  }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="gameOverScreen">
  <div>You Died!<br/>Score: <span id="finalScore">0</span></div>
  <button id="restartBtn">Restart</button>
</div>

<div id="ui">
  <div id="joystick"><div id="stick"></div></div>
  <div id="jumpBtn">Jump</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
(() => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x20232a);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(0, 10, 10);
  scene.add(dirLight);

  // Player cube
  const playerSize = 1;
  const playerGeometry = new THREE.BoxGeometry(playerSize, playerSize * 2, playerSize);
  const playerMaterial = new THREE.MeshStandardMaterial({color: 0x00ff00});
  const player = new THREE.Mesh(playerGeometry, playerMaterial);
  player.position.set(0, playerSize, 0);
  scene.add(player);

  // Floor/platforms
  const platformWidth = 4;
  const platformDepth = 8;
  const platformHeight = 0.5;
  const platforms = [];

  // Materials for platforms & traps
  const normalMat = new THREE.MeshStandardMaterial({color: 0x444444});
  const spikeMat = new THREE.MeshStandardMaterial({color: 0xff4444});
  const lavaMat = new THREE.MeshStandardMaterial({color: 0xffa500});

  // Game variables
  let forwardSpeed = 0.15;
  let lateralSpeed = 0.1;
  let jumpSpeed = 0.25;
  let gravity = 0.015;
  let velocityY = 0;
  let onGround = true;

  // Controls variables
  let moveX = 0; // -1 left, 0 none, 1 right

  // Score and distance
  let distance = 0;

  // Camera follow offset
  const camOffset = new THREE.Vector3(0, 5, 10);

  // UI elements
  const scoreEl = document.getElementById('score');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');
  const joystick = document.getElementById('joystick');
  const stick = document.getElementById('stick');
  const jumpBtn = document.getElementById('jumpBtn');

  // Joystick vars
  const joystickCenter = {x: 60, y: 60};
  let joystickActive = false;
  let joystickPos = {x: 60, y: 60};
  let joystickMaxRadius = 40;

  // Initialize platforms forward
  let platformZ = 0;
  function createPlatform(z, type='normal', x=0) {
    const geometry = new THREE.BoxGeometry(platformWidth, platformHeight, platformDepth);
    let material = normalMat;
    if(type === 'spike') material = spikeMat;
    else if(type === 'lava') material = lavaMat;

    const platform = new THREE.Mesh(geometry, material);
    platform.position.set(x, 0, z);
    platform.userData.type = type;
    scene.add(platform);
    platforms.push(platform);
  }

  for(let i=0; i<15; i++) createPlatform(i * -platformDepth);

  // Randomly add trap platforms
  function addNextPlatform() {
    platformZ -= platformDepth;
    const trapChance = Math.random();
    let type = 'normal';
    if (trapChance < 0.2) type = 'spike';
    else if (trapChance < 0.35) type = 'lava';

    // Random X: -platformWidth, 0, or +platformWidth (3 lanes)
    const laneX = [-platformWidth, 0, platformWidth][Math.floor(Math.random() * 3)];

    createPlatform(platformZ, type, laneX);
  }

  // Remove old platforms far behind
  function cleanupPlatforms() {
    for(let i=platforms.length-1; i>=0; i--) {
      if(platforms[i].position.z > player.position.z + 15) {
        scene.remove(platforms[i]);
        platforms.splice(i,1);
      }
    }
  }

  // Collision detection between player and platform traps
  function checkTrapCollision() {
    for(let plat of platforms) {
      const dx = Math.abs(plat.position.x - player.position.x);
      const dz = Math.abs(plat.position.z - player.position.z);
      const dy = player.position.y - platformHeight / 2; // Player base Y approx

      if(dx < platformWidth/1.8 && dz < platformDepth/1.8) {
        if (plat.userData.type === 'spike' || plat.userData.type === 'lava') {
          if(dy < platformHeight + 0.5) return true;
        }
      }
    }
    return false;
  }

  // Player jump logic
  function jump() {
    if(onGround) {
      velocityY = jumpSpeed;
      onGround = false;
    }
  }

  // Joystick handlers
  function joystickStart(e) {
    e.preventDefault();
    joystickActive = true;
  }
  function joystickMove(e) {
    if(!joystickActive) return;
    e.preventDefault();
    let touch = e.touches ? e.touches[0] : e;
    const rect = joystick.getBoundingClientRect();
    let x = touch.clientX - rect.left;
    let y = touch.clientY - rect.top;

    let dx = x - joystickCenter.x;
    let dy = y - joystickCenter.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    let angle = Math.atan2(dy, dx);

    if(dist > joystickMaxRadius) dist = joystickMaxRadius;
    joystickPos.x = joystickCenter.x + Math.cos(angle) * dist;
    joystickPos.y = joystickCenter.y + Math.sin(angle) * dist;

    stick.style.left = (joystickPos.x - stick.offsetWidth/2) + 'px';
    stick.style.top = (joystickPos.y - stick.offsetHeight/2) + 'px';

    // Only horizontal movement from dx
    moveX = dx < -10 ? -1 : dx > 10 ? 1 : 0;
  }
  function joystickEnd(e) {
    joystickActive = false;
    moveX = 0;
    joystickPos.x = joystickCenter.x;
    joystickPos.y = joystickCenter.y;
    stick.style.left = (joystickPos.x - stick.offsetWidth/2) + 'px';
    stick.style.top = (joystickPos.y - stick.offsetHeight/2) + 'px';
  }

  // Event listeners
  joystick.addEventListener('touchstart', joystickStart);
  joystick.addEventListener('touchmove', joystickMove);
  joystick.addEventListener('touchend', joystickEnd);
  joystick.addEventListener('mousedown', joystickStart);
  window.addEventListener('mousemove', joystickMove);
  window.addEventListener('mouseup', joystickEnd);

  jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
  jumpBtn.addEventListener('mousedown', e => { e.preventDefault(); jump(); });

  // Game state
  let dead = false;

  // Restart game
  function restart() {
    // Reset player
    player.position.set(0, playerSize, 0);
    velocityY = 0;
    onGround = true;
    moveX = 0;
    distance = 0;
    platformZ = 0;
    dead = false;
    scoreEl.textContent = 'Score: 0';
    gameOverScreen.style.display = 'none';

    // Remove old platforms
    for(let p of platforms) scene.remove(p);
    platforms.length = 0;
    for(let i=0; i<15; i++) createPlatform(i * -platformDepth);
  }

  restartBtn.onclick = restart;

  // Game loop
  function animate() {
    if(dead) {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
      return;
    }

    // Move player forward
    player.position.z -= forwardSpeed;

    // Lateral move with clamp for 3 lanes [-platformWidth,0,platformWidth]
    player.position.x += moveX * lateralSpeed;
    if(player.position.x < -platformWidth) player.position.x = -platformWidth;
    if(player.position.x > platformWidth) player.position.x = platformWidth;

    // Apply gravity and jump
    velocityY -= gravity;
    player.position.y += velocityY;

    // Check ground collision (platform is at y=0 + half height)
    if(player.position.y <= playerSize) {
      player.position.y = playerSize;
      velocityY = 0;
      onGround = true;
    }

    // Add new platforms ahead
    if(platformZ > player.position.z - platformDepth * 15) {
      addNextPlatform();
    }

    cleanupPlatforms();

    // Update camera behind player
    camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y + 3, player.position.z + 10), 0.1);
    camera.lookAt(player.position.x, player.position.y, player.position.z);

    // Increase score by distance traveled
    distance += forwardSpeed;
    scoreEl.textContent = 'Score: ' + Math.floor(distance);

    // Check death conditions
    if(player.position.y < -5 || checkTrapCollision()) {
      dead = true;
      finalScoreEl.textContent = Math.floor(distance);
      gameOverScreen.style.display = 'block';
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  animate();

  // Resize handler
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

</body>
</html>

</html>
