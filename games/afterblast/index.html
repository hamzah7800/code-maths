<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Enhanced Zombie Shooter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui; }
    #game { display: block; width: 100%; height: 100vh; touch-action: none; background: linear-gradient(#222, #111); }
    .ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
    .panel { background: rgba(0, 0, 0, 0.4); padding: 6px 10px; border-radius: 8px; pointer-events: auto; }
    #shopBtn { cursor: pointer; }
    #shop { position: absolute; top: 60px; right: 10px; width: 220px; background: rgba(0, 0, 0, 0.9); border-radius: 10px; padding: 8px; color: #fff; display: none; z-index: 10; }
    .shop-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    button.buy { background: #2b7; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .joystick { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.02); display: flex; align-items: center; justify-content: center; touch-action: none; pointer-events: none; }
    .stick { width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); pointer-events: none; transform: translate(0, 0); }
    #leftJoy { left: 12px; bottom: 12px; }
    #rightJoy { right: 12px; bottom: 12px; position: absolute; }
    .aimDir { position: absolute; width: 2px; height: 45px; background: rgba(255, 255, 255, 0.25); top: 50%; left: 50%; transform-origin: center bottom; pointer-events: none; border-radius: 1px; }
    .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 180px; background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; }
    #pauseOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; color: #fff; font-size: 28px; z-index: 5; }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div id="pauseOverlay">PAUSED</div>

<div class="ui">
  <div class="panel" id="hudLeft">Health: <span id="hp">100</span> &nbsp; Coins: <span id="coins">0</span></div>
  <div class="panel" id="hudRight">
    Weapon: <span id="weaponName">Pistol</span> &nbsp; Ammo: <span id="ammo">∞</span>
    <button id="shopBtn" class="panel" style="margin-left:8px;">Shop</button>
  </div>
</div>

<div id="shop">
  <div style="font-weight:700;margin-bottom:6px;">Shop</div>
  <div class="shop-item"><div>Rifle (+rate & dmg)</div><div><button class="buy" onclick="buy('rifle',50)">Buy 50</button></div></div>
  <div class="shop-item"><div>Kevlar (reduce dmg)</div><div><button class="buy" onclick="buy('armor',80)">Buy 80</button></div></div>
  <div class="shop-item"><div>Health Potion</div><div><button class="buy" onclick="buy('healthPotion',30)">Buy 30</button></div></div>
  <div class="shop-item"><div>Speed Boost</div><div><button class="buy" onclick="buy('speedBoost',40)">Buy 40</button></div></div>
  <div style="text-align:center;margin-top:8px;"><button class="buy" onclick="closeShop()">Close</button></div>
</div>

<div id="leftJoy" class="joystick"><div class="stick" id="leftStick"></div></div>
<div id="rightJoy" class="joystick">
  <div class="aimDir" id="aimDir"></div>
  <div class="stick" id="rightStick"></div>
</div>

<div id="toast" class="toast" style="display:none"></div>
