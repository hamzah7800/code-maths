<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Mobile Multiplayer</title>
<style>body{margin:0;overflow:hidden;}canvas{display:block;}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-peer/simplepeer.min.js"></script>

<script>
let scene, camera, renderer;
let localPlayer, players = {};
let bullets = [];
let peer;

// --- THREE.JS SETUP ---
scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7.5);
scene.add(light);

// Ground
const groundGeo = new THREE.BoxGeometry(50,1,50);
const groundMat = new THREE.MeshStandardMaterial({color:0x00ff00});
const ground = new THREE.Mesh(groundGeo,groundMat);
ground.position.y=-1;
scene.add(ground);

// Local player
const playerGeo = new THREE.BoxGeometry(1,2,1);
const playerMat = new THREE.MeshStandardMaterial({color:0xff0000});
localPlayer = new THREE.Mesh(playerGeo,playerMat);
localPlayer.position.y = 1;
scene.add(localPlayer);
camera.position.set(0,3,5);

// --- SIMPLE MOVEMENT ---
let keys = {};
document.addEventListener('keydown', e=>keys[e.code]=true);
document.addEventListener('keyup', e=>keys[e.code]=false);

function movePlayer(){
    if(keys['ArrowUp'] || keys['KeyW']) localPlayer.position.z -= 0.1;
    if(keys['ArrowDown'] || keys['KeyS']) localPlayer.position.z += 0.1;
    if(keys['ArrowLeft'] || keys['KeyA']) localPlayer.position.x -= 0.1;
    if(keys['ArrowRight'] || keys['KeyD']) localPlayer.position.x += 0.1;
}

// --- SHOOTING ---
document.addEventListener('click', ()=>{
    const bulletGeo = new THREE.SphereGeometry(0.2,8,8);
    const bulletMat = new THREE.MeshStandardMaterial({color:0xffff00});
    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
    bullet.position.copy(localPlayer.position);
    bullet.userData = {velocity: new THREE.Vector3(0,0,-0.5)};
    bullets.push(bullet);
    scene.add(bullet);

    // Send bullet to peer
    if(peer) peer.send(JSON.stringify({type:'bullet',pos:bullet.position.toArray()}));
});

// --- BUILDING ---
document.addEventListener('keypress', e=>{
    if(e.code==='KeyB'){
        const blockGeo = new THREE.BoxGeometry(1,1,1);
        const blockMat = new THREE.MeshStandardMaterial({color:0x888888});
        const block = new THREE.Mesh(blockGeo,blockMat);
        block.position.set(localPlayer.position.x,localPlayer.position.y+1,localPlayer.position.z);
        scene.add(block);

        if(peer) peer.send(JSON.stringify({type:'build',pos:block.position.toArray()}));
    }
});

// --- RENDER LOOP ---
function animate(){
    requestAnimationFrame(animate);
    movePlayer();
    bullets.forEach((b,i)=>{
        b.position.add(b.userData.velocity);
        if(b.position.z<-50) { scene.remove(b); bullets.splice(i,1); }
    });
    camera.position.lerp(new THREE.Vector3(localPlayer.position.x, localPlayer.position.y+3, localPlayer.position.z+5),0.1);
    camera.lookAt(localPlayer.position);
    renderer.render(scene,camera);
}
animate();

// --- PEER TO PEER ---
function joinPeer(offerSignal=null){
    peer = new SimplePeer({initiator:!offerSignal, trickle:false});
    peer.on('signal', data=>{
        console.log('PEER SIGNAL (share with friend):', JSON.stringify(data));
    });
    peer.on('data', data=>{
        const msg = JSON.parse(data);
        if(msg.type==='bullet'){
            const bGeo = new THREE.SphereGeometry(0.2,8,8);
            const bMat = new THREE.MeshStandardMaterial({color:0x0000ff});
            const b = new THREE.Mesh(bGeo,bMat);
            b.position.fromArray(msg.pos);
            b.userData={velocity:new THREE.Vector3(0,0,-0.5)};
            bullets.push(b);
            scene.add(b);
        }
        if(msg.type==='build'){
            const blockGeo = new THREE.BoxGeometry(1,1,1);
            const blockMat = new THREE.MeshStandardMaterial({color:0x555555});
            const block = new THREE.Mesh(blockGeo,blockMat);
            block.position.fromArray(msg.pos);
            scene.add(block);
        }
    });
    if(offerSignal) peer.signal(offerSignal);
}

// Usage: Copy the "PEER SIGNAL" output from one player and pass as argument to joinPeer() in another tab/device
</script>
</body>
</html>
