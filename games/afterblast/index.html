<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afterblast 3D: Base & Upgrade Demo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.min.js"></script>

    <style>
        body { margin: 0; background-color: #1a1a1a; overflow: hidden; color: #ecf0f1; font-family: 'Arial', sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; }
        
        /* Overlay for the 2D UI */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through by default */
        }
        
        /* General Panel Styling */
        .panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #e74c3c;
            padding: 20px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
            pointer-events: auto; /* Re-enable pointer events for the menu content */
            display: none; /* Hidden by default */
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            color: #ecf0f1;
            z-index: 10; /* Ensure UI is above the canvas */
        }

        #interaction-prompt {
            position: absolute;
            top: 80%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 62, 80, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            color: #2ecc71;
            font-weight: bold;
            display: none;
            pointer-events: none;
            z-index: 5;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #34495e;
        }

        .upgrade-btn {
            background-color: #2ecc71;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            pointer-events: auto;
            transition: background-color 0.2s;
        }
        .upgrade-btn:hover { background-color: #27ae60; }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            z-index: 11;
        }

    </style>
</head>
<body>
    <div id="container"></div>

    <div id="ui-overlay">
        <div id="interaction-prompt">Press E to Interact with Terminal</div>

        <div id="upgrade-base-panel" class="panel" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <button class="close-btn" onclick="closeUI()">X</button>
            <h2>EXO-RIG UPGRADES <span style="color: #f1c40f;">(Scrap: <span id="scrap-count">0</span>)</span></h2>
            
            <h3>Base Gear (Exo-Rig)</h3>
            <div class="item">
                <span>**Integrity Matrix** (Health) - LVL <span id="h-lvl">1</span></span>
                <button class="upgrade-btn" data-stat="health">Upgrade (<span id="h-cost">100</span> Scrap)</button>
            </div>
            <div class="item">
                <span>**Power Core** (Energy/Ability) - LVL <span id="e-lvl">1</span></span>
                <button class="upgrade-btn" data-stat="energy">Upgrade (<span id="e-cost">150</span> Scrap)</button>
            </div>
            
            <h3>Weapon Systems</h3>
            <div class="item">
                <span>**Kinetic Rifle** (Damage) - LVL <span id="w-lvl">1</span></span>
                <button class="upgrade-btn" data-stat="weapon">Upgrade (<span id="w-cost">200</span> Scrap)</button>
            </div>
        </div>
    </div>
    
    <script>
        // --- THREE.JS INITIALIZATION ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a1a); // Dark background
        document.getElementById('container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 5); // soft white light
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // --- GAME STATE ---
        let gameState = 'EXPLORE'; // 'EXPLORE' or 'UPGRADE'
        const BASE_COSTS = { health: 100, energy: 150, weapon: 200 };
        
        let playerStats = {
            scrap: 500, // Starting scrap for demo
            healthLevel: 1,
            energyLevel: 1,
            weaponLevel: 1,
        };
        
        // --- PLAYER AND TERMINAL ---
        
        // 1. Player (Scavenger) - Replaced Capsule with Cylinder to fix the error
        // Parameters: radiusTop, radiusBottom, height, radialSegments
        const playerGeometry = new THREE.CylinderGeometry(0.5, 0.5, 3.0, 16); 
        const playerMaterial = new THREE.MeshPhongMaterial({ color: 0x2ecc71 }); // Green
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.set(0, 1.5, 5); // Adjusted Y position for cylinder height
        scene.add(player);

        // 2. Upgrade Terminal - Interactable object
        const terminalGeometry = new THREE.BoxGeometry(1, 2, 1);
        const terminalMaterial = new THREE.MeshBasicMaterial({ color: 0xe74c3c }); // Red
        const terminal = new THREE.Mesh(terminalGeometry, terminalMaterial);
        terminal.position.set(-5, 1, 0); // Positioned away from spawn
        terminal.name = 'UpgradeTerminal';
        scene.add(terminal);

        // 3. Simple Base Floor
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x2c3e50, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = Math.PI / 2; // Rotate flat
        floor.position.y = 0;
        scene.add(floor);
        
        // --- CAMERA SETUP ---
        
        // UPGRADE camera target (looking at the terminal)
        const exploreCameraTarget = new THREE.Vector3(0, 0, 0);
        const upgradeCameraPos = new THREE.Vector3(terminal.position.x + 3, terminal.position.y + 1, terminal.position.z + 3);
        const upgradeCameraLookAt = terminal.position;
        
        // Initial EXPLORE camera position
        camera.position.set(10, 5, 10);
        camera.lookAt(exploreCameraTarget);

        // --- CORE GAME FUNCTIONS ---

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update(); // Update TWEEN.js animations (for smooth camera)
            
            // Simple camera orbit in EXPLORE mode
            if (gameState === 'EXPLORE') {
                const time = Date.now() * 0.0005;
                camera.position.x = Math.cos(time) * 10;
                camera.position.z = Math.sin(time) * 10;
                camera.position.y = 5;
                camera.lookAt(exploreCameraTarget);
                
                // Rotate the player slightly
                player.rotation.y += 0.01;
                
            } else if (gameState === 'UPGRADE') {
                // In upgrade mode, keep the terminal pulsing
                terminal.rotation.y += 0.01; 
            }
            
            // Interaction Prompt Visibility
            const distance = player.position.distanceTo(terminal.position);
            const prompt = document.getElementById('interaction-prompt');

            // Show prompt only if close AND in explore mode
            if (distance < 8 && gameState === 'EXPLORE') {
                prompt.style.display = 'block';
            } else {
                prompt.style.display = 'none';
            }

            renderer.render(scene, camera);
        }

        // --- UPGRADE LOGIC ---

        function getUpgradeCost(stat) {
             let level = 0;
             if (stat === 'health') level = playerStats.healthLevel;
             else if (stat === 'energy') level = playerStats.energyLevel;
             else if (stat === 'weapon') level = playerStats.weaponLevel;
             
             // Cost scales exponentially for demonstration
             return BASE_COSTS[stat] * level * level; 
        }

        function upgrade(stat) {
            const cost = getUpgradeCost(stat);
            let levelKey = stat + 'Level';
            
            if (playerStats.scrap >= cost) {
                playerStats.scrap -= cost;
                playerStats[levelKey]++;
                updateUI();
                // Optionally give the player model a visual cue, e.g., a flash of light
                console.log(`${stat} upgraded to level ${playerStats[levelKey]}`);
            } else {
                alert(`Insufficient scrap! Need ${cost} for this upgrade.`);
            }
        }
        
        // --- UI AND CAMERA TRANSITION FUNCTIONS ---

        function updateUI() {
            document.getElementById('scrap-count').textContent = playerStats.scrap;

            // Update Health UI
            document.getElementById('h-lvl').textContent = playerStats.healthLevel;
            document.getElementById('h-cost').textContent = getUpgradeCost('health');
            
            // Update Energy UI
            document.getElementById('e-lvl').textContent = playerStats.energyLevel;
            document.getElementById('e-cost').textContent = getUpgradeCost('energy');
            
            // Update Weapon UI
            document.getElementById('w-lvl').textContent = playerStats.weaponLevel;
            document.getElementById('w-cost').textContent = getUpgradeCost('weapon');
            
            // Re-attach listeners to new buttons (if they were dynamic, but here we just re-run)
            attachUpgradeListeners();
        }

        function attachUpgradeListeners() {
            document.querySelectorAll('.upgrade-btn').forEach(button => {
                button.onclick = () => upgrade(button.getAttribute('data-stat'));
            });
        }

        function openUI() {
            if (gameState === 'UPGRADE') return;
            
            // Check distance before interacting (8 units)
            if (player.position.distanceTo(terminal.position) > 8) {
                return; 
            }

            gameState = 'UPGRADE';
            
            // 1. Smoothly move camera to terminal view
            new TWEEN.Tween(camera.position)
                .to(upgradeCameraPos, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();

            // 2. Smoothly adjust what the camera is looking at
            // Note: The Tween updates the camera's internal lookAt target over time
            new TWEEN.Tween(camera.rotation)
                .to(new THREE.Vector3().setFromEuler(new THREE.Euler().setFromVector3(terminal.position)), 1000)
                .onUpdate(() => {
                    camera.lookAt(terminal.position);
                })
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();

            // 3. Show the UI panel
            setTimeout(() => {
                document.getElementById('upgrade-base-panel').style.display = 'block';
                document.getElementById('interaction-prompt').style.display = 'none';
                updateUI();
            }, 500);
        }

        window.closeUI = function() {
            document.getElementById('upgrade-base-panel').style.display = 'none';
            gameState = 'EXPLORE';

            // The main animate loop will take over and transition the camera back to its orbiting explore state.
        }

        // --- EVENT LISTENERS ---

        document.addEventListener('keydown', (event) => {
            if (event.key === 'e' || event.key === 'E') {
                if (gameState === 'EXPLORE') {
                    openUI();
                } else if (gameState === 'UPGRADE') {
                    closeUI();
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the engine
        updateUI(); // Initial UI update
        animate();
    </script>
</body>
</html>
