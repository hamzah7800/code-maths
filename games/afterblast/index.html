<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Mobile-first Web FPS (starter)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div id="fps">FPS: --</div>
    <div id="hint">Click / Tap to lock and control — WASD or left joystick to move.</div>
  </div>
  <div id="mobile-ui" class="hidden">
    <div id="left-joystick" class="joystick"></div>
    <div id="right-area" class="right-area"></div>
    <button id="jump-btn" class="touch-btn">Jump</button>
    <button id="sprint-btn" class="touch-btn">Sprint</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
