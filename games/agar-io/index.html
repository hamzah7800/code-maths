<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Agar-like Multiplayer</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b1220;overflow:hidden}
canvas{display:block;width:100%;height:100vh;background:linear-gradient(180deg,#07101a,#0b1220)}
#ui{position:fixed;top:12px;left:12px;color:#fff;font-family:monospace;z-index:10}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">Hold <b>R</b> to Run | Move: Mouse/Arrow Keys/WASD</div>

<script>
// ==== Setup canvas ====
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=canvas.width=innerWidth,H=canvas.height=innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});

const WORLD_SIZE=3000;

// ==== Player ====
let player={x:Math.random()*WORLD_SIZE,y:Math.random()*WORLD_SIZE,r:18,color:'#4bc0c8'};
let peers={}; // other players

// ==== Pellets ====
let pellets=[];
for(let i=0;i<400;i++){pellets.push({x:Math.random()*WORLD_SIZE,y:Math.random()*WORLD_SIZE,r:4+Math.random()*2,color:'#ffca66'})}

// ==== Input ====
let mouseX=0,mouseY=0,mouseDown=false,keys={};
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top});
canvas.addEventListener('mousedown',()=>mouseDown=true);
canvas.addEventListener('mouseup',()=>mouseDown=false);
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

// ==== Camera ====
let camX=player.x, camY=player.y, camScale=1.0;

// ==== P2P via WebSocket Signaling ====
const ws=new WebSocket('ws://localhost:8080'); // signaling server
let peerConnections={};

ws.onmessage=async msg=>{
    const data=JSON.parse(msg.data);
    if(data.type==='offer'){await handleOffer(data);}
    else if(data.type==='answer'){await handleAnswer(data);}
    else if(data.type==='ice'){await handleIce(data);}
}

function createPeer(id,initiator){
    const pc=new RTCPeerConnection();
    let dc=null;
    if(initiator){ dc=pc.createDataChannel('game'); setupDataChannel(id,dc);}
    else{ pc.ondatachannel=e=>setupDataChannel(id,e.channel);}
    pc.onicecandidate=e=>{if(e.candidate) ws.send(JSON.stringify({type:'ice',id,candidate:e.candidate}));};
    peerConnections[id]=pc;
    return pc;
}

function setupDataChannel(id,dc){
    dc.onmessage=e=>{peers[id]=JSON.parse(e.data);}
    peerConnections[id].dc=dc;
}

async function handleOffer(data){
    const pc=createPeer(data.id,false);
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({type:'answer',id:data.id,answer}));
}

async function handleAnswer(data){
    const pc=peerConnections[data.id];
    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
}

async function handleIce(data){
    const pc=peerConnections[data.id];
    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
}

// ==== Game Loop ====
let last=performance.now();
function loop(t){
    const dt=Math.min(0.05,(t-last)/1000);
    update(dt);
    render();
    last=t;
    requestAnimationFrame(loop);
}

// ==== Update ====
function update(dt){
    // Mouse / Keyboard movement
    const targetX=camX+(mouseX-W/2)/camScale;
    const targetY=camY+(mouseY-H/2)/camScale;

    let kbvx=0,kbvy=0;
    if(keys.ArrowUp||keys.w) kbvy-=1; if(keys.ArrowDown||keys.s) kbvy+=1;
    if(keys.ArrowLeft||keys.a) kbvx-=1; if(keys.ArrowRight||keys.d) kbvx+=1;

    let dirx=targetX-player.x;
    let diry=targetY-player.y;
    let len=Math.hypot(dirx,diry)||1;
    dirx/=len; diry/=len;
    const speedBase=180/Math.sqrt(player.r);
    player.vx=(dirx*0.9+kbvx*0.6)*speedBase*dt*60;
    player.vy=(diry*0.9+kbvy*0.6)*speedBase*dt*60;

    // ---- RUN / DASH hold R ----
    if(keys.r || keys.R){
        const dash=450;
        player.vx+=dirx*dash*dt;
        player.vy+=diry*dash*dt;
        player.r=Math.max(8,Math.sqrt(player.r*player.r-0.3));
    }

    player.x+=player.vx;
    player.y+=player.vy;
    player.x=clamp(player.x,0,WORLD_SIZE);
    player.y=clamp(player.y,0,WORLD_SIZE);

    // Pellets collision
    for(let i=pellets.length-1;i>=0;i--){
        const p=pellets[i];
        if(dist2(p,player)<(p.r+player.r)*(p.r+player.r)){
            player.r=Math.sqrt(player.r*player.r+p.r*p.r*0.8);
            pellets[i]={x:Math.random()*WORLD_SIZE,y:Math.random()*WORLD_SIZE,r:4+Math.random()*2,color:'#ffca66'};
        }
    }

    // Camera follow
    camX+=0.1*(player.x-camX);
    camY+=0.1*(player.y-camY);
    camScale=clamp(1.2/Math.log10(player.r+10),0.35,1.2);

    // Send player state to peers
    const state={x:player.x,y:player.y,r:player.r,color:player.color};
    for(const id in peerConnections){
        const dc=peerConnections[id].dc;
        if(dc && dc.readyState==='open') dc.send(JSON.stringify(state));
    }
}

// ==== Render ====
function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.scale(camScale,camScale);
    ctx.translate(-camX,-camY);

    // Pellets
    for(const p of pellets){drawCircle(p.x,p.y,p.r,p.color);}

    // Other players
    for(const id in peers){
        const p=peers[id];
        drawCircle(p.x,p.y,p.r,p.color);
    }

    // Player
    drawCircle(player.x,player.y,player.r,player.color,true);
    ctx.restore();
}

function drawCircle(x,y,r,color,glow=false){
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.closePath();
    if(glow){
        const g=ctx.createRadialGradient(x,y,r*0.2,x,y,r*2);
        g.addColorStop(0,color); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g; ctx.globalAlpha=0.95; ctx.fill(); ctx.globalAlpha=1;
        ctx.lineWidth=3; ctx.strokeStyle=color; ctx.stroke();
    } else {
        ctx.fillStyle=color; ctx.fill(); ctx.strokeStyle=color; ctx.stroke();
    }
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist2(a,b){return (a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y);}

loop(0);
</script>
</body>
</html>
