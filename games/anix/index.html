<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium Hub</title>
    <style>
        :root { --bg: #050505; --accent: #ffb11b; --panel: #111113; --text: #eee; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .nav { background: #000; padding: 1rem 5%; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.8rem; text-decoration: none; cursor: pointer; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }
        
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .anime-card { background: var(--panel); padding: 45px 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.2s; }
        .anime-card:hover { border-color: var(--accent); }

        #player-view { display: none; }
        .player-shell { background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #333; position: relative; aspect-ratio: 16/9; }
        iframe { width: 100%; height: 100%; border: none; }

        .cc-overlay { position: absolute; bottom: 10%; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        .cc-text { background: rgba(0,0,0,0.85); color: #fff; padding: 8px 16px; font-size: 1.5rem; font-weight: bold; border: 1px solid var(--accent); border-radius: 4px; }

        .ai-bar { background: var(--panel); padding: 15px; border-radius: 0 0 16px 16px; display: flex; align-items: center; border: 1px solid #333; border-top: none; }
        .sync-btn { background: #222; color: #fff; border: 1px solid #444; padding: 5px 12px; border-radius: 4px; cursor: pointer; margin: 0 5px; font-weight: bold; }
        .sync-btn:hover { border-color: var(--accent); color: var(--accent); }

        .season-label { margin: 20px 0 10px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .ep-item { background: #1a1a1a; padding: 12px 0; text-align: center; border-radius: 6px; cursor: pointer; border: 1px solid #333; font-size: 0.9rem; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        
        .back { color: var(--accent); cursor: pointer; margin-bottom: 15px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="location.reload()">ANIX</a></nav>

<div id="home-view" class="container">
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <div class="back" onclick="showHome()">← BACK</div>
    <div class="player-shell">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
        <div id="cc-overlay"><span class="cc-text" id="ai-output">AI CC: STANDBY</span></div>
    </div>
    
    <div class="ai-bar">
        <span style="font-size: 0.8rem; color: #888; margin-right: 15px;">SMART SYNC:</span>
        <button class="sync-btn" onclick="adjustSync(-1)">-1s</button>
        <button class="sync-btn" onclick="adjustSync(-5)">-5s</button>
        <div id="offset-display" style="font-weight: bold; width: 60px; text-align: center;">0s</div>
        <button class="sync-btn" onclick="adjustSync(1)">+1s</button>
        <button class="sync-btn" onclick="adjustSync(5)">+5s</button>
        <button class="sync-btn" style="margin-left:auto; background: var(--accent); color:#000;" onclick="toggleAI()">TOGGLE MIC-AI</button>
    </div>

    <div id="episode-list-container"></div>
</div>

<script>
    const library = {
        "aot": { 
            title: "Attack on Titan", 
            seasons: [
                { name: "Season 1", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z","1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi","1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9","1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut","1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i","1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv","1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk","14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ","1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV","1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u","1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag","1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7","1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"] },
                { name: "Season 2", ids: ["1uX2W_M2rV5tYV_P6E9Tf0v7K0mFzGjI2", "1-V_6XW-G0o3Z3bZ4K_L0o-V-G_G0o3Z", "1_ID_Placeholder_3", "1_ID_Placeholder_4", "1_ID_Placeholder_5", "1_ID_Placeholder_6", "1_ID_Placeholder_7", "1_ID_Placeholder_8", "1_ID_Placeholder_9", "1_ID_Placeholder_10", "1_ID_Placeholder_11", "1_ID_Placeholder_12"] }
            ]
        },
        "drstone": { title: "Dr. Stone", seasons: [{ name: "Season 1", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] }] },
        "bloodhounds": { title: "Bloodhounds", seasons: [{ name: "S1", ids: [] }] },
        "witchhat": { title: "Witch Hat Atelier", seasons: [{ name: "S1", ids: [] }] }
    };

    let recognition;
    let aiActive = false;
    let currentOffset = 0;

    function setupAI() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "en-US";
        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript + " ";
            }
            document.getElementById("ai-output").innerText = transcript;
        };
        recognition.onerror = (e) => console.log("AI Error:", e.error);
        recognition.onend = () => { if (aiActive) setTimeout(() => { recognition.start(); }, 500); };
    }

    function toggleAI() {
        if (!recognition) setupAI();
        if (aiActive) {
            recognition.stop();
            aiActive = false;
            document.getElementById("ai-output").innerText = "AI CC: STANDBY";
        } else {
            recognition.start();
            aiActive = true;
        }
    }

    function adjustSync(val) {
        currentOffset += val;
        document.getElementById('offset-display').innerText = currentOffset + "s";
    }

    function init() {
        const grid = document.getElementById('mainGrid');
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<strong>${library[key].title}</strong>`;
            card.onclick = () => openPlayer(key);
            grid.appendChild(card);
        });
    }

    function openPlayer(key) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        const container = document.getElementById('episode-list-container');
        container.innerHTML = '';

        library[key].seasons.forEach(s => {
            const label = document.createElement('div');
            label.className = 'season-label';
            label.innerText = s.name;
            container.appendChild(label);

            const grid = document.createElement('div');
            grid.className = 'ep-grid';
            s.ids.forEach((id, i) => {
                const ep = document.createElement('div');
                ep.className = 'ep-item';
                ep.innerText = i + 1;
                ep.onclick = () => {
                    document.getElementById('videoIframe').src = `https://drive.google.com/file/d/${id}/preview`;
                    document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
                    ep.classList.add('active');
                };
                grid.appendChild(ep);
            });
            container.appendChild(grid);
        });
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoIframe').src = '';
    }

    init();
</script>
</body>
</html>
