<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium</title>
    <style>
        :root { --bg: #050505; --accent: #ffb11b; --panel: #111113; --text: #eee; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        /* Navigation */
        .nav { background: #000; padding: 1rem 5%; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.8rem; text-decoration: none; cursor: pointer; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }
        
        /* Anime Grid */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .anime-card { background: var(--panel); padding: 45px 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.2s; }
        .anime-card:hover { border-color: var(--accent); background: #18181b; }

        #player-view { display: none; }
        .player-shell { background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #333; position: relative; }
        iframe { width: 100%; height: 100%; aspect-ratio: 16/9; border: none; display: block; }

        /* Modern AI CC Overlay */
        #ai-overlay {
            position: absolute; bottom: 10%; left: 0; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        .ai-text {
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px;
            font-size: 1.6rem; font-weight: 700; border-radius: 6px; 
            border: 1px solid var(--accent); text-shadow: 2px 2px 4px #000;
        }

        /* AI Controller */
        .ai-status-bar { 
            background: var(--panel); padding: 15px 25px; border-radius: 0 0 16px 16px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; border-top: none;
        }
        .ai-btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        /* Episode Selector */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 2rem; }
        .ep-item { background: #1a1a1a; padding: 15px 0; text-align: center; border-radius: 8px; cursor: pointer; border: 1px solid #333; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .back-nav { margin-bottom: 15px; color: var(--accent); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="location.reload()">ANIX</a></nav>

<div id="home-view" class="container">
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <div class="back-nav" onclick="showHome()">← BACK</div>
    
    <div class="player-shell">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
        <div id="ai-overlay" style="display:none;"><span class="ai-text" id="ai-output">AI Listening...</span></div>
    </div>

    <div class="ai-status-bar">
        <div id="status">AI ENGINE: READY</div>
        <button class="ai-btn" id="aiBtn" onclick="activateAI()">START LIVE AI CC</button>
    </div>

    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const library = {
        "aot": { title: "Attack on Titan", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z","1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi","1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9","1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut","1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i","1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv","1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk","14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ","1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV","1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u","1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag","1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7","1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"] },
        "drstone": { title: "Dr. Stone", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] },
        "bloodhounds": { title: "Bloodhounds", ids: [] },
        "witchhat": { title: "Witch Hat Atelier", ids: [] }
    };

    let recognition;
    let aiActive = false;

    // This uses the built-in Chrome/Edge AI engine (No download required)
    function setupAI() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            alert("Browser AI not supported. Use Chrome or Edge.");
            return;
        }
        recognition = new Speech();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript = event.results[i][0].transcript;
            }
            document.getElementById('ai-output').innerText = transcript;
        };

        recognition.onerror = () => { if(aiActive) recognition.start(); };
        recognition.onend = () => { if(aiActive) recognition.start(); };
    }

    function activateAI() {
        const btn = document.getElementById('aiBtn');
        const overlay = document.getElementById('ai-overlay');
        
        if (!aiActive) {
            if(!recognition) setupAI();
            recognition.start();
            aiActive = true;
            btn.innerText = "STOP AI";
            btn.style.background = "#ff4444";
            overlay.style.display = "block";
            document.getElementById('status').innerText = "AI ENGINE: LISTENING...";
        } else {
            recognition.stop();
            aiActive = false;
            btn.innerText = "START LIVE AI CC";
            btn.style.background = "var(--accent)";
            overlay.style.display = "none";
            document.getElementById('status').innerText = "AI ENGINE: READY";
        }
    }

    function init() {
        const grid = document.getElementById('mainGrid');
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<strong>${library[key].title}</strong>`;
            card.onclick = () => {
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('player-view').style.display = 'block';
                renderEps(key);
            };
            grid.appendChild(card);
        });
    }

    function renderEps(key) {
        const list = document.getElementById('epList');
        list.innerHTML = '';
        library[key].ids.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            div.innerText = i + 1;
            div.onclick = () => {
                document.getElementById('videoIframe').src = `https://drive.google.com/file/d/${id}/preview`;
                document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
                div.classList.add('active');
            };
            list.appendChild(div);
        });
        if(library[key].ids.length > 0) list.firstChild.click();
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'grid';
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoIframe').src = '';
    }

    init();
</script>
</body>
</html>
