<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Pro Streaming</title>
    <style>
        :root { --bg: #0b0c10; --accent: #00bcd4; --panel: #1b1b22; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; }
        
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent); }
        .logo { color: var(--accent); text-decoration: none; font-weight: 900; font-size: 22px; }

        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* Fixed Video Box - No more Zoom issues */
        .video-box { 
            width: 100%; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            aspect-ratio: 16/9;
        }
        video { width: 100%; height: 100%; outline: none; }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; margin-top: 25px; }
        .ep-item { background: #222; padding: 15px 0; text-align: center; cursor: pointer; border-radius: 4px; border: 1px solid #333; transition: 0.3s; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }

        .memory-note { color: var(--accent); font-size: 13px; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">ANIX</a>
    <div id="curTitle">Loading Episode...</div>
</div>

<div class="main-container">
    <div class="video-box">
        <video id="vPlayer" controls crossorigin="anonymous">
            <source src="" type="video/mp4">
        </video>
    </div>
    <div id="status" class="memory-note"></div>

    <h3>Episodes</h3>
    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const aotIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", "1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP", "1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K", "1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
        "1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ", "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4",
        "14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV", "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp",
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", "1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA", "1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR", "1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE", "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh",
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", "1niPlio07f_99u1-OtW_54uWkJwBouocx",
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ",
        "1nsROetRCw6VEeT0zgDpiLVGng_zEQNut", "1VHBr6nap3clpLaOYUjz32QE63SssHe-4",
        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K"
    ];

    const video = document.getElementById('vPlayer');
    const status = document.getElementById('status');
    let currentEpIndex = 0;

    // --- 1. RENDER EPISODES ---
    const epList = document.getElementById('epList');
    aotIds.forEach((id, i) => {
        const div = document.createElement('div');
        div.className = 'ep-item';
        div.innerText = i + 1;
        div.onclick = () => loadEpisode(i);
        epList.appendChild(div);
    });

    // --- 2. LOAD SYSTEM ---
    function loadEpisode(index) {
        currentEpIndex = index;
        const id = aotIds[index];
        
        // Direct Download Link format (Necessary for Memory)
        const streamUrl = `https://drive.google.com/uc?export=download&id=${id}`;
        
        video.src = streamUrl;
        document.getElementById('curTitle').innerText = `Episode ${index + 1}`;
        
        // UI Active Class
        document.querySelectorAll('.ep-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });

        // Check Memory for this specific episode
        const savedTime = localStorage.getItem(`anix_time_ep${index}`);
        if (savedTime) {
            video.currentTime = parseFloat(savedTime);
            status.innerText = `Resumed at ${Math.floor(savedTime/60)}m ${Math.floor(savedTime%60)}s`;
        } else {
            status.innerText = "Starting fresh...";
        }

        video.play();
        localStorage.setItem('anix_last_ep', index);
    }

    // --- 3. MEMORY TRACKER ---
    // Every time the video plays, save the current second to local storage
    video.ontimeupdate = () => {
        if (video.currentTime > 0) {
            localStorage.setItem(`anix_time_ep${currentEpIndex}`, video.currentTime);
        }
    };

    // --- 4. STARTUP ---
    const lastEp = localStorage.getItem('anix_last_ep');
    loadEpisode(lastEp ? parseInt(lastEp) : 0);
</script>

</body>
</html>
