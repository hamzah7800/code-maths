<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --bg: #050505; --accent: #00bcd4; --panel: #111; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: #fff; }
        
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .logo { color: var(--accent); text-decoration: none; font-weight: 900; font-size: 22px; }

        .main-container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Hide Google UI by using a container that clips the top */
        .player-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* The trick to hide the top-right logo: scale it slightly and hide overflow */
        iframe {
            position: absolute;
            top: -50px; /* Moves the Google header out of view */
            left: 0;
            width: 100%;
            height: calc(100% + 100px); /* Makes up for the shift */
            border: none;
        }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 20px; }
        .ep-item { background: #1a1a1a; padding: 15px; text-align: center; cursor: pointer; border-radius: 8px; transition: 0.3s; border: 1px solid #333; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .save-notification {
            position: fixed; bottom: 20px; right: 20px; background: var(--accent);
            color: #000; padding: 10px 20px; border-radius: 5px; font-weight: bold;
            display: none; z-index: 100;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">ANIX</a>
    <div id="epTitle">Episode 1</div>
</div>

<div class="main-container">
    <div class="player-container">
        <iframe id="mainPlayer" src="" allow="autoplay"></iframe>
    </div>

    <div id="saveNote" class="save-notification">Progress Saved!</div>

    <h3>Episodes</h3>
    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const aotIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", "1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP", "1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K", "1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
        "1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ", "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4",
        "14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV", "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp",
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", "1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA", "1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR", "1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE", "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh",
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", "1niPlio07f_99u1-OtW_54uWkJwBouocx",
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ",
        "1nsROetRCw6VEeT0zgDpiLVGng_zEQNut", "1VHBr6nap3clpLaOYUjz32QE63SssHe-4",
        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K"
    ];

    const player = document.getElementById('mainPlayer');
    const epList = document.getElementById('epList');

    // --- MEMORY SYSTEM ---
    function saveLastEpisode(index) {
        localStorage.setItem('anix_last_ep', index);
        showNote();
    }

    function showNote() {
        const note = document.getElementById('saveNote');
        note.style.display = 'block';
        setTimeout(() => note.style.display = 'none', 2000);
    }

    // --- RENDER EPISODES ---
    aotIds.forEach((id, i) => {
        const btn = document.createElement('div');
        btn.className = 'ep-item';
        btn.innerText = i + 1;
        
        btn.onclick = () => {
            loadEpisode(i);
        };
        epList.appendChild(btn);
    });

    function loadEpisode(index) {
        const id = aotIds[index];
        player.src = `https://drive.google.com/file/d/${id}/preview`;
        
        // Update Styles
        document.querySelectorAll('.ep-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
        document.getElementById('epTitle').innerText = `Episode ${index + 1}`;
        
        // Save to memory
        localStorage.setItem('anix_last_ep', index);
    }

    // --- AUTO-RESUME ON LOAD ---
    const savedEp = localStorage.getItem('anix_last_ep');
    if (savedEp !== null) {
        loadEpisode(parseInt(savedEp));
    } else {
        loadEpisode(0); // Start at Ep 1 if no memory
    }
</script>

</body>
</html>
