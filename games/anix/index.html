<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Library</title>
    <style>
        :root { 
            --bg: #050505; 
            --accent: #ffb11b; 
            --panel: #111113; 
            --text: #eee; 
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Nav */
        .nav { 
            background: #000; 
            padding: 1rem 5%; 
            border-bottom: 1px solid #222; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            color: var(--accent); 
            font-weight: 900; 
            font-size: 1.8rem; 
            text-decoration: none; 
            cursor: pointer; 
            user-select: none;
        }
        
        .container { 
            width: 100%;
            max-width: 1100px; 
            margin: 1.5rem auto; 
            padding: 0 1rem; 
        }
        
        /* Grid Layouts - Adapts on small screens */
        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 1.2rem; 
        }

        @media (min-width: 480px) {
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        .anime-card { 
            background: var(--panel); 
            padding: 60px 15px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #222; 
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
            user-select: none;
        }

        @media (hover: hover) {
            .anime-card:hover { 
                border-color: var(--accent); 
                transform: translateY(-5px); 
                box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
            }
        }

        /* Player wrapper scaling natively across aspect ratios */
        #player-view { display: none; }
        .player-shell { 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #222; 
            position: relative; 
            width: 100%;
            aspect-ratio: 16/9; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            margin-bottom: 1.5rem;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        /* Episode UI Items - Mobile First Touch Target Sizes */
        .season-label { 
            margin: 20px 0 10px; 
            font-weight: 900; 
            color: var(--accent); 
            text-transform: uppercase; 
            font-size: 0.85rem; 
            letter-spacing: 2px; 
        }
        .ep-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        .ep-item { 
            background: #1a1a1a; 
            padding: 12px 0; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid #333; 
            font-weight: 600; 
            font-size: 0.9rem;
            min-height: 44px; /* Apple/Android standards compliance for finger targets */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            user-select: none;
        }
        @media (hover: hover) {
            .ep-item:hover { border-color: var(--accent); color: var(--accent); }
        }
        .ep-item.active { 
            background: var(--accent); 
            color: #000; 
            border-color: var(--accent); 
        }
        
        .back { 
            color: var(--accent); 
            cursor: pointer; 
            margin-bottom: 15px; 
            font-weight: bold; 
            display: inline-flex; 
            align-items: center;
            text-transform: uppercase; 
            font-size: 0.85rem; 
            letter-spacing: 1px; 
            padding: 8px 0;
            user-select: none;
        }
        
        .empty-notice {
            color: #777;
            font-style: italic;
            padding: 10px 0;
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="logo" onclick="showHome()">ANIX</div>
</nav>

<div id="home-view" class="container">
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <div class="back" onclick="showHome()">← Back to Library</div>
    <div class="player-shell">
        <iframe id="videoIframe" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>
    <div id="episode-list-container"></div>
</div>

<script>
    const library = {
        "aot": { 
            title: "Attack on Titan", 
            seasons: [
                { 
                    name: "Season 1", 
                    ids: [
                        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z",
                        "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi",
                        "1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9",
                        "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut",
                        "1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
                        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
                        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
                        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ",
                        "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV",
                        "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
                        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
                        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
                        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"
                    ] 
                },
                { 
                    name: "Season 2", 
                    ids: [
                        "1uX2W_M2rV5tYV_P6E9Tf0v7K0mFzGjI2", "ID_PLACEHOLDER_27", "ID_PLACEHOLDER_28",
                        "ID_PLACEHOLDER_29", "ID_PLACEHOLDER_30", "ID_PLACEHOLDER_31",
                        "ID_PLACEHOLDER_32", "ID_PLACEHOLDER_33", "ID_PLACEHOLDER_34",
                        "ID_PLACEHOLDER_35", "ID_PLACEHOLDER_36", "ID_PLACEHOLDER_37"
                    ] 
                }
            ]
        },
        "drstone": { title: "Dr. Stone", seasons: [{ name: "Season 1", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] }] },
        "bloodhounds": { title: "Bloodhounds", seasons: [{ name: "Season 1", ids: [] }] },
        "witchhat": { title: "Witch Hat Atelier", seasons: [{ name: "Season 1", ids: [] }] }
    };

    function init() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<strong>${library[key].title}</strong>`;
            card.onclick = () => openPlayer(key);
            grid.appendChild(card);
        });
    }

    function openPlayer(key) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        const container = document.getElementById('episode-list-container');
        container.innerHTML = '';

        let firstItem = null;
        let firstId = null;

        const series = library[key];
        
        // Dynamic continuous episode numbering track across seasons
        let cumulativeEpisodeCount = 0; 

        series.seasons.forEach(s => {
            const label = document.createElement('div');
            label.className = 'season-label';
            label.innerText = s.name;
            container.appendChild(label);

            if (!s.ids || s.ids.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-notice';
                empty.innerText = 'No episodes available yet.';
                container.appendChild(empty);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'ep-grid';
            
            s.ids.forEach((id, i) => {
                cumulativeEpisodeCount++;
                const ep = document.createElement('div');
                ep.className = 'ep-item';
                ep.innerText = cumulativeEpisodeCount;
                
                const targetId = id;
                ep.onclick = () => {
                    if (targetId.includes('PLACEHOLDER')) {
                        alert("This episode source isn't ready yet!");
                        return;
                    }
                    const iframe = document.getElementById('videoIframe');
                    iframe.src = `https://drive.google.com/file/d/${targetId}/preview`;
                    
                    document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
                    ep.classList.add('active');
                };

                // Track first valid episode to auto-start play logic gracefully
                if (!firstId && !id.includes('PLACEHOLDER')) {
                    firstId = id;
                    firstItem = ep;
                }

                grid.appendChild(ep);
            });
            container.appendChild(grid);
        });

        // Autoplay the first actual playable item found upon navigation hook
        if (firstItem && firstId) {
            firstItem.click();
        }
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoIframe').src = '';
    }

    init();
</script>
</body>
</html>
