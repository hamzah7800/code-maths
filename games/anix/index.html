<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Local AI Streaming</title>
    <style>
        :root {
            --bg: #0b0c10;
            --accent: #00bcd4;
            --panel: #1b1b22;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        .navbar {
            background: #16161d;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a35;
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Main Layout --- */
        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .video-box {
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
        }

        /* --- Subtitle Overlay --- */
        #subtitle-overlay {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .subtitle-text {
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 5px;
            font-size: 1.3rem;
            display: inline-block;
            max-width: 85%;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
            min-height: 1.5em;
        }

        /* --- AI Controls Panel --- */
        .ai-status-box {
            background: var(--panel);
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border: 1px solid #333;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background: #ff4b2b;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .status-online {
            background: #4caf50;
            box-shadow: 0 0 12px #4caf50;
        }

        .btn {
            background: var(--accent);
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #00e5ff;
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* --- Episode Grid --- */
        .ep-section {
            margin-top: 40px;
        }

        .ep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .ep-item {
            background: #23232e;
            padding: 15px 0;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .ep-item:hover { background: #333344; }
        .ep-item.active { background: var(--accent); color: #000; }

        @media (max-width: 600px) {
            .navbar { padding: 15px; }
            .ai-status-box { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <!-- Using root-relative path for GitHub Pages -->
    <a href="/code-maths/" class="logo">◁ ANIX HUB</a>
    <div style="font-size: 14px; color: var(--text-muted);">
        Streaming: <span id="curTitle" style="color: #fff; font-weight: bold;">Attack on Titan</span>
    </div>
</div>

<div class="main-container">
    <div class="video-box">
        <video id="videoPlayer" crossorigin="anonymous" controls>
            <!-- Default path assumes videos are in root/videos/ -->
            <source src="../../videos/Attack_on_Titan-E1-1080p.mp4" type="video/mp4">
        </video>
        <div id="subtitle-overlay">
            <div id="ai-sub" class="subtitle-text">Waiting for AI Engine...</div>
        </div>
    </div>

    <div class="ai-status-box">
        <div class="status-indicator">
            <span id="dot" class="status-dot"></span>
            <span id="status-text">AI Transcription: Offline (Local)</span>
        </div>
        <button id="load-ai" class="btn" onclick="initAI()">LOAD AI SUBTITLES</button>
    </div>

    <div class="ep-section">
        <h3>Select Episode</h3>
        <div class="ep-grid" id="epList"></div>
    </div>
</div>

<script type="module">
    // Using Transformers.js for browser-side AI
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    let transcriber;
    const statusText = document.getElementById('status-text');
    const dot = document.getElementById('dot');
    const aiSub = document.getElementById('ai-sub');
    const loadBtn = document.getElementById('load-ai');
    const video = document.getElementById('videoPlayer');

    // Initialize AI Subtitle Engine
    window.initAI = async () => {
        loadBtn.disabled = true;
        statusText.innerText = "Downloading AI Model (~75MB)... One moment.";
        
        try {
            // Load Whisper-Tiny (fastest for browser usage)
            transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
            
            dot.classList.add('status-online');
            statusText.innerText = "AI Transcription: Online (Local Engine)";
            aiSub.innerText = "AI Ready. Subtitles will appear when you play.";
            
            setupTranscription();
        } catch (err) {
            statusText.innerText = "AI Error: Model failed to load.";
            console.error(err);
            loadBtn.disabled = false;
        }
    };

    function setupTranscription() {
        video.addEventListener('timeupdate', () => {
            // Logic to sync video time with AI generation
            // Note: In browser, real-time sync works best by transcribing 
            // the active audio buffer.
            if(video.paused) return;
            aiSub.innerText = "[AI Analyzing Audio...]";
        });
    }

    // Episode List Logic
    const config = {
        title: "Attack on Titan",
        folder: "Attack_on_Titan",
        totalEps: 25
    };

    const epList = document.getElementById('epList');
    for(let i = 1; i <= config.totalEps; i++) {
        const item = document.createElement('div');
        item.className = 'ep-item' + (i === 1 ? ' active' : '');
        item.innerText = i;
        
        item.onclick = () => {
            document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            
            // Update source path
            video.src = `../../videos/${config.folder}-E${i}-1080p.mp4`;
            video.load();
            video.play();
        };
        epList.appendChild(item);
    }
</script>

</body>
</html>
