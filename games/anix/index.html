<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | AI Anime Player</title>
    <style>
        :root {
            --bg: #0b0c10;
            --accent: #00bcd4;
            --panel: #1b1b22;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: #fff;
        }

        /* --- Navbar --- */
        .navbar { 
            background: #16161d; padding: 15px 30px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #2a2a35;
        }
        .logo { 
            font-weight: 900; color: var(--accent); 
            text-decoration: none; font-size: 20px;
        }

        /* --- Player Area --- */
        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .video-box { 
            background: #000; width: 100%; aspect-ratio: 16/9; 
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; }

        /* --- Subtitles --- */
        #subtitle-overlay {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .subtitle-text {
            background: rgba(0, 0, 0, 0.7); padding: 5px 15px; border-radius: 5px;
            font-size: 1.2rem; display: inline-block; max-width: 80%;
            min-height: 1.5em;
        }

        /* --- AI Controls --- */
        .ai-panel {
            background: var(--panel); padding: 15px; border-radius: 10px;
            margin-top: 20px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid #333;
        }
        .btn {
            background: var(--accent); color: #000; border: none;
            padding: 10px 20px; border-radius: 5px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .btn:disabled { background: #444; color: #888; }

        /* --- Episode/Series Selection --- */
        .series-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #222; border: none; color: white; padding: 10px; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: var(--accent); color: black; font-weight: bold; }

        .ep-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
            gap: 10px; margin-top: 20px; 
        }
        .ep-item { 
            background: #222; padding: 12px; text-align: center; 
            cursor: pointer; border-radius: 5px; transition: 0.2s;
        }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">◁ ANIX HUB</a>
    <div id="curTitle">Attack on Titan - Episode 1</div>
</div>

<div class="main-container">
    <div class="video-box">
        <video id="videoPlayer" crossorigin="anonymous" controls>
            <source src="" type="video/mp4">
        </video>
        <div id="subtitle-overlay">
            <div id="ai-sub" class="subtitle-text">AI Subtitles Offline</div>
        </div>
    </div>

    <div class="ai-panel">
        <div id="ai-status">AI Status: Local Engine Ready</div>
        <button id="load-ai" class="btn" onclick="initAI()">ENABLE AI SUBS</button>
    </div>

    <h3>Series Selection</h3>
    <div class="series-tabs" id="seriesTabs">
        <button class="tab-btn active" onclick="switchSeries('aot')">Attack on Titan</button>
        <button class="tab-btn" onclick="switchSeries('witch')">Witch Hat Atelier</button>
        <button class="tab-btn" onclick="switchSeries('stone')">Dr. Stone</button>
    </div>

    <h3>Episodes</h3>
    <div class="ep-grid" id="epList"></div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    const video = document.getElementById('videoPlayer');
    const aiSub = document.getElementById('ai-sub');
    const status = document.getElementById('ai-status');
    const epList = document.getElementById('epList');
    let transcriber;

    // --- DATA CONFIGURATION ---
    const animeData = {
        'aot': {
            title: "Attack on Titan",
            ids: [
                "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", // Ep 1 (The one you provided)
                "SECOND_ID_HERE", 
                "THIRD_ID_HERE"
            ]
        },
        'witch': {
            title: "Witch Hat Atelier",
            ids: ["WITCH_ID_1", "WITCH_ID_2"]
        },
        'stone': {
            title: "Dr. Stone",
            ids: ["STONE_ID_1", "STONE_ID_2"]
        }
    };

    let currentSeries = 'aot';

    // --- LOAD EPISODES ---
    window.renderEpisodes = (seriesKey) => {
        epList.innerHTML = '';
        const series = animeData[seriesKey];
        
        series.ids.forEach((id, index) => {
            const epNum = index + 1;
            const div = document.createElement('div');
            div.className = 'ep-item' + (epNum === 1 ? ' active' : '');
            div.innerText = epNum;

            div.onclick = () => {
                document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
                div.classList.add('active');
                document.getElementById('curTitle').innerText = `${series.title} - Episode ${epNum}`;
                
                // Using the specific format you found:
                video.src = `https://drive.usercontent.google.com/download?id=${id}&export=download`;
                video.play();
            };
            epList.appendChild(div);
        });

        // Set default source for first ep of selected series
        video.src = `https://drive.usercontent.google.com/download?id=${series.ids[0]}&export=download`;
    };

    window.switchSeries = (key) => {
        currentSeries = key;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderEpisodes(key);
    };

    // --- AI LOGIC ---
    window.initAI = async () => {
        status.innerText = "Loading AI Model (~75MB)...";
        document.getElementById('load-ai').disabled = true;
        try {
            transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
            status.innerText = "AI Engine: ONLINE";
            aiSub.innerText = "[AI Ready]";
        } catch (e) {
            status.innerText = "AI Error: Failed to load";
        }
    };

    // Start with AOT
    renderEpisodes('aot');
</script>

</body>
</html>
