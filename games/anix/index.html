<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Stable Streaming</title>
    <style>
        :root { --bg: #0b0c10; --accent: #00bcd4; --panel: #1b1b22; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; }
        
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent); }
        .logo { color: var(--accent); text-decoration: none; font-weight: 900; font-size: 22px; }

        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* Fixed Video Box - Perfect 16:9 Ratio */
        .video-box { 
            width: 100%; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            aspect-ratio: 16/9;
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .controls-info { display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; }
        .memory-tag { color: var(--accent); font-size: 13px; background: rgba(0,188,212,0.1); padding: 4px 10px; border-radius: 4px; }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 12px; margin-top: 10px; }
        .ep-item { 
            background: #1a1a1a; padding: 15px 0; text-align: center; cursor: pointer; 
            border-radius: 8px; border: 1px solid #333; transition: 0.3s; position: relative;
        }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        .ep-item.watched::after {
            content: '✓'; position: absolute; top: 2px; right: 5px; font-size: 10px; color: #4caf50;
        }

        h3 { margin-bottom: 5px; font-weight: 400; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">ANIX</a>
    <div id="curTitle">Select an Episode</div>
</div>

<div class="main-container">
    <div class="video-box">
        <iframe id="anixPlayer" src="" allow="autoplay" allowfullscreen></iframe>
    </div>

    <div class="controls-info">
        <div id="status" class="memory-tag">Welcome back!</div>
        <div style="font-size: 12px; color: #666;">Server: Google-Legacy</div>
    </div>

    <h3>Episodes</h3>
    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const aotIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", "1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP", "1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K", "1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
        "1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ", "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4",
        "14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV", "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp",
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", "1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA", "1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR", "1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE", "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh",
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", "1niPlio07f_99u1-OtW_54uWkJwBouocx",
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ",
        "1nsROetRCw6VEeT0zgDpiLVGng_zEQNut", "1VHBr6nap3clpLaOYUjz32QE63SssHe-4",
        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K"
    ];

    const player = document.getElementById('anixPlayer');
    const epList = document.getElementById('epList');
    const status = document.getElementById('status');

    // Load watched episodes from memory
    let watched = JSON.parse(localStorage.getItem('anix_watched') || '[]');

    function loadEpisode(index) {
        const id = aotIds[index];
        player.src = `https://drive.google.com/file/d/${id}/preview`;
        
        document.getElementById('curTitle').innerText = `Episode ${index + 1}`;
        
        // Update Grid UI
        document.querySelectorAll('.ep-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });

        // Save progress
        localStorage.setItem('anix_current_ep', index);
        if(!watched.includes(index)) {
            watched.push(index);
            localStorage.setItem('anix_watched', JSON.stringify(watched));
        }
        
        status.innerText = `Now Playing Episode ${index + 1}`;
        renderGrid(); // Refresh checkmarks
    }

    function renderGrid() {
        epList.innerHTML = '';
        aotIds.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            if (watched.includes(i)) div.classList.add('watched');
            const current = localStorage.getItem('anix_current_ep');
            if (current == i) div.classList.add('active');
            
            div.innerText = i + 1;
            div.onclick = () => loadEpisode(i);
            epList.appendChild(div);
        });
    }

    // Startup: Load last watched episode
    const lastSaved = localStorage.getItem('anix_current_ep');
    renderGrid();
    loadEpisode(lastSaved ? parseInt(lastSaved) : 0);

</script>

</body>
</html>
