<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Streaming</title>
    <style>
        :root { --bg: #0b0c10; --accent: #ffb11b; --panel: #1b1b22; --text: #eee; }
        body.light { --bg: #f5f5f5; --panel: #fff; --text: #222; }
        
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; }
        
        /* --- HiAnime Style Navbar --- */
        .navbar { background: #000; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); }
        .logo { color: var(--accent); text-decoration: none; font-weight: 800; font-size: 24px; }
        .nav-tools { display: flex; gap: 15px; }

        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        
        /* --- Theater Player --- */
        .player-area { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; }

        .video-info { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; }
        .btn-continue { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* --- Episode List --- */
        .ep-section { margin-top: 30px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; }
        .ep-item { 
            background: var(--panel); padding: 12px 0; text-align: center; cursor: pointer; 
            border-radius: 4px; border: 1px solid #333; position: relative; font-size: 14px;
        }
        .ep-item.active { border: 2px solid var(--accent); color: var(--accent); font-weight: bold; }
        .ep-item.viewed::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #4caf50; }

        .theme-toggle { cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">ANIX</a>
    <div class="nav-tools">
        <span class="theme-toggle" onclick="toggleTheme()">🌓</span>
    </div>
</div>

<div class="main-container">
    <div class="player-area">
        <iframe id="videoIframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="video-info">
        <div>
            <h2 id="curDisplay">Episode 1</h2>
            <p style="font-size: 12px; color: #888;">Auto-Next Enabled • Premium Server</p>
        </div>
        <button class="btn-continue" onclick="resumeLast()">Continue Watching</button>
    </div>

    <div class="ep-section">
        <h3>Episodes</h3>
        <div class="ep-grid" id="epList"></div>
    </div>
</div>

<script>
    const aotIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", "1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP", "1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K", "1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
        "1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ", "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4",
        "14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV", "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp",
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", "1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA", "1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR", "1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE", "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh",
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", "1niPlio07f_99u1-OtW_54uWkJwBouocx",
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ",
        "1nsROetRCw6VEeT0zgDpiLVGng_zEQNut", "1VHBr6nap3clpLaOYUjz32QE63SssHe-4",
        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K"
    ];

    const iframe = document.getElementById('videoIframe');
    const epList = document.getElementById('epList');
    
    // --- Memory State ---
    let history = JSON.parse(localStorage.getItem('anix_history') || '[]');
    let lastEp = localStorage.getItem('anix_last_ep') || 0;

    function init() {
        renderEpisodes();
        loadEpisode(parseInt(lastEp));
    }

    function renderEpisodes() {
        epList.innerHTML = '';
        aotIds.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = `ep-item ${i == lastEp ? 'active' : ''} ${history.includes(i) ? 'viewed' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => loadEpisode(i);
            epList.appendChild(div);
        });
    }

    function loadEpisode(index) {
        if(index >= aotIds.length) return; // End of season
        
        lastEp = index;
        const id = aotIds[index];
        iframe.src = `https://drive.google.com/file/d/${id}/preview`;
        document.getElementById('curDisplay').innerText = `Episode ${index + 1}`;
        
        // Save to Memory
        localStorage.setItem('anix_last_ep', index);
        if(!history.includes(index)) {
            history.push(index);
            localStorage.setItem('anix_history', JSON.stringify(history));
        }
        
        renderEpisodes();
    }

    function resumeLast() {
        loadEpisode(parseInt(localStorage.getItem('anix_last_ep') || 0));
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function toggleTheme() {
        document.body.classList.toggle('light');
    }

    // --- HI-ANIME FEATURE: Auto Next ---
    // Since we can't detect "ended" in an iframe, we use a timer (20 mins) 
    // to mark as viewed and suggest next ep, but standard practice for iframes 
    // is to let the user click.

    init();
</script>

</body>
</html>
