<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium Hub</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --bg: #060606; --accent: #ffb11b; --card: #121212; --text: #eee; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        .nav { background: #000; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--accent); text-decoration: none; font-weight: 800; font-size: 1.6rem; cursor: pointer; }

        .container { max-width: 1300px; margin: 2rem auto; padding: 0 1rem; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.5rem; }
        
        .anime-card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #222; transition: 0.3s; position: relative; }
        .anime-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(255,177,27,0.1); }
        .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
        .anime-info { padding: 12px; font-weight: 600; text-align: center; font-size: 0.85rem; border-top: 1px solid var(--glass); }

        #player-view { display: none; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--glass); }
        
        .season-tabs { display: flex; gap: 10px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 10px 20px; background: var(--glass); border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; }
        .ep-item { background: var(--glass); padding: 15px 0; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; font-size: 14px; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .btn-back { background: var(--accent); border: none; color: #000; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="showHome()">ANIX</a></nav>

<div id="home-view" class="container">
    <h2 style="margin-bottom:20px; border-left: 4px solid var(--accent); padding-left:15px;">Your Library</h2>
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <button class="btn-back" onclick="showHome()">← BACK TO BROWSE</button>
    <div class="player-wrapper">
        <div id="player" data-plyr-provider="google" data-plyr-embed-id=""></div>
    </div>
    <h2 id="displayTitle" style="margin: 25px 0 10px 0;">Loading...</h2>
    <div class="season-tabs" id="seasonTabs"></div>
    <div class="ep-grid" id="epList"></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
    const library = {
        "aot": {
            title: "Attack on Titan",
            img: "https://image.tmdb.org/t/p/w500/hTP1DtL7v1hR68pOXuePMv9s7E9.jpg",
            seasons: [
                { name: "Season 1", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z","1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi","1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9","1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut","1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i","1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv","1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk","14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ","1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV","1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u","1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag","1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7","1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"] },
                { name: "Season 2", ids: ["1DfNiMEwPQFKe3fZOEddpZ6EkHPoCNlAU","1xl-ouijY6_kKpUQyICkSQPPih56sOOYA","1UtyYNTV1PgrPfKhT0RsMAftr1Uokfgsd","1QV6hTJ0OxATSZictaQPaBlau2qi-4XLp","1H1R_4LYJa2qflK1eZgYkDt4G69RISeri","1SK88R7f_82l7s04NEh4gIxZCA47m6mbA","1E6tV95OhzM8jDuBGoYAsm9oYaj8oNAPL","15bjnN0NWvtFUbRlRGuX81RPtZZCTFjZJ","13UR2S4vmgoqVz4yI6Lc7ylaTCxocfLQD","1zz6dB40uPyB-Ey7CBsZnaiNxRTPvAjYG","1EDK0bgd-iyQPvwSLAcMsOgQBNAo_4YE9","1K7esCh67CX_yv2-13B8fvMV1osbvyyrF"] }
            ]
        },
        "drstone": {
            title: "Dr. Stone",
            img: "https://image.tmdb.org/t/p/w500/pY4XAn4K77m0R465UofS7vAasG1.jpg",
            seasons: [{ name: "Season 1", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] }]
        },
        "bloodhounds": {
            title: "Bloodhounds",
            img: "https://image.tmdb.org/t/p/w500/3oLpQ8KqX1DqDk93V9SNoW5nLpA.jpg",
            seasons: [{ name: "Season 1", ids: [] }]
        },
        "witchhat": {
            title: "Witch Hat Atelier",
            img: "https://image.tmdb.org/t/p/w500/6vD9Ym03i8lT9uN0Y8pYp9v0P9.jpg",
            seasons: [{ name: "Season 1", ids: [] }]
        }
    };

    let activeKey = "";
    let activeSeason = 0;
    const player = new Plyr('#player', { captions: { active: true, update: true, language: 'en' } });

    function init() {
        const grid = document.getElementById('mainGrid');
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<img src="${library[key].img}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'"><div class="anime-info">${library[key].title}</div>`;
            card.onclick = () => openPlayer(key);
            grid.appendChild(card);
        });
    }

    function openPlayer(key) {
        activeKey = key;
        activeSeason = 0;
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        updateUI();
    }

    function updateUI() {
        const anime = library[activeKey];
        document.getElementById('displayTitle').innerText = anime.title;
        
        const tabContainer = document.getElementById('seasonTabs');
        tabContainer.innerHTML = '';
        if (anime.seasons.length > 1) {
            anime.seasons.forEach((s, i) => {
                const btn = document.createElement('div');
                btn.className = `tab ${i === activeSeason ? 'active' : ''}`;
                btn.innerText = s.name;
                btn.onclick = () => { activeSeason = i; updateUI(); };
                tabContainer.appendChild(btn);
            });
        }

        const epGrid = document.getElementById('epList');
        epGrid.innerHTML = '';
        const currentIds = anime.seasons[activeSeason].ids;

        if(currentIds.length === 0) {
            epGrid.innerHTML = '<p style="color:#888; padding:20px;">No episodes added yet. Add IDs to library to watch.</p>';
            return;
        }

        currentIds.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            div.innerText = i + 1;
            div.onclick = () => playVideo(id, i);
            epGrid.appendChild(div);
        });
        playVideo(currentIds[0], 0);
    }

    function playVideo(id, idx) {
        const seasonName = library[activeKey].seasons[activeSeason].name.toLowerCase().replace(" ", "");
        
        player.source = {
            type: 'video',
            sources: [{ src: id, provider: 'google' }],
            tracks: [{
                kind: 'captions',
                label: 'English AI',
                srclang: 'en',
                // Look in your /subs folder for files like: aot-season1-e1.vtt
                src: `subs/${activeKey}-${seasonName}-e${idx + 1}.vtt`,
                default: true
            }]
        };

        document.querySelectorAll('.ep-item').forEach((item, i) => {
            item.classList.toggle('active', i === idx);
        });
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('player-view').style.display = 'none';
        player.stop();
    }

    init();
</script>
</body>
</html>
