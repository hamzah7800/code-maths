<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Multi-Server Media Hub</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --accent-color: #38bdf8;
            --muted-color: #8b8d99;
            --border: #2e2e35;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .domain-tracker {
            background: #1e1b4b;
            border: 1px solid #3730a3;
            color: #c7d2fe;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .domain-tracker strong {
            color: #fff;
        }

        .domain-list {
            margin-top: 5px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-family: monospace;
        }

        .domain-tag {
            background: #312e81;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #a5b4fc;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0c0c0d;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid var(--accent-color);
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .results-heading {
            margin: 1.5rem 0 0.75rem 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 2rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
            font-size: 0.85rem;
            padding-bottom: 8px;
        }

        .result-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .result-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #000;
        }

        .result-title {
            padding: 6px 4px 2px 4px;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-year {
            color: var(--muted-color);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-select {
            padding: 8px 12px;
            background: #0c0c0d;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: none;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error {
            color: #f43f5e;
            display: none;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="domain-tracker">
        <strong>Bookmark this file (Ctrl + D)</strong> to save your layout config. 
        <div style="margin-top: 5px;">Alternative tracked proxy mirrors:</div>
        <div class="domain-list">
            <span class="domain-tag">vidsrc2.ru</span>
            <span class="domain-tag">vidsrcme.ru</span>
            <span class="domain-tag">vidsrc-me.ru</span>
            <span class="domain-tag">vidsrc-embed.ru</span>
            <span class="domain-tag">vsrc.su</span>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="showInput" placeholder="Search movies or shows (e.g., Sonic)..." value="Sonic">
        <button onclick="searchMedia()">Smart Search</button>
    </div>

    <div id="resultsHeading" class="results-heading">Search Results</div>
    <div id="resultsGrid" class="results-grid"></div>

    <div id="controlsRow" class="controls-row">
        <span id="playingTitle" style="font-weight: bold; color: #fff;"></span>
        
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <!-- Season Picker -->
            <div class="control-group" id="seasonGroup">
                <label for="seasonChooser">Season: </label>
                <select id="seasonChooser" class="server-select" onchange="handleSeasonChange()">
                    <option value="1">1</option>
                </select>
            </div>

            <!-- Episode Picker -->
            <div class="control-group" id="episodeGroup">
                <label for="episodeChooser">Episode: </label>
                <select id="episodeChooser" class="server-select" onchange="updatePlayerSource()">
                    <option value="1">1</option>
                </select>
            </div>

            <!-- Server Picker -->
            <div class="control-group">
                <label for="serverChooser">Server: </label>
                <select id="serverChooser" class="server-select" onchange="updatePlayerSource()">
                    <option value="vidlink">VidLink.pro (Custom Player)</option>
                    <option value="otakuvid">OtakuVid.online (Anime Only)</option>
                    <option value="multiembed">MultiEmbed (.mov)</option>
                    <option value="vidsrcpm">VidSrc.pm</option>
                    <option value="vidsrcin">VidSrc.in</option>
                </select>
            </div>

            <!-- Anime Sub/Dub Picker -->
            <div class="control-group" id="animeToggleGroup" style="display: none;">
                <label for="animeFormat">Type: </label>
                <select id="animeFormat" class="server-select" onchange="updatePlayerSource()">
                    <option value="sub">Subtitled</option>
                    <option value="dub">English Dubbed</option>
                </select>
            </div>
        </div>
    </div>

    <div id="errorMessage" class="error"></div>

    <div id="playerWrapper" class="player-wrapper">
        <iframe id="videoPlayer" 
                src="" 
                allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture"
                referrerpolicy="origin">
        </iframe>
    </div>
</div>

<script>
    let currentImdbId = "";
    let currentTmdbId = "";
    let currentShowId = ""; // TVMaze Show ID for querying seasons/episodes
    let currentMediaType = "tv"; 
    let seasonsData = [];

    async function searchMedia() {
        const query = document.getElementById('showInput').value.trim();
        const grid = document.getElementById('resultsGrid');
        const heading = document.getElementById('resultsHeading');
        const errorDiv = document.getElementById('errorMessage');
        
        if (!query) return;

        grid.innerHTML = "";
        heading.style.display = "none";
        errorDiv.style.display = 'none';

        try {
            const response = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
            if (!response.ok) throw new Error('Network error parsing search catalog.');
            
            const results = await response.json();
            if (results.length === 0) throw new Error('No matching titles found.');

            heading.style.display = "block";
            
            results.forEach(item => {
                const show = item.show;
                if (!show.externals || !show.externals.imdb) return; 

                const card = document.createElement('div');
                card.className = 'result-card';
                
                const posterImg = show.image?.medium || 'https://via.placeholder.com/130x170?text=No+Poster';
                const releaseYear = show.premiered ? show.premiered.split('-')[0] : 'N/A';
                
                let itemType = "tv";
                if ((show.type === "Animation" && show.runtime > 75) || show.genres.includes("Movie")) {
                    itemType = "movie";
                } else if (show.genres.includes("Anime") || show.network?.country?.code === "JP") {
                    itemType = "anime";
                }

                card.innerHTML = `
                    <img src="${posterImg}" alt="${show.name}">
                    <div class="result-title">${show.name}</div>
                    <div class="result-year">${releaseYear} (${show.type || 'Show'})</div>
                `;
                
                card.onclick = () => selectMedia(show.externals.imdb, show.externals.thetvdb || show.externals.imdb, show.id, show.name, itemType);
                grid.appendChild(card);
            });

            if(grid.children.length === 0) {
                throw new Error('No items found with explicit backend mapping records.');
            }

        } catch (err) {
            errorDiv.innerText = err.message;
            errorDiv.style.display = 'block';
        }
    }

    async function selectMedia(imdbId, tmdbId, showId, title, type) {
        currentImdbId = imdbId;
        currentTmdbId = tmdbId;
        currentShowId = showId;
        currentMediaType = type;

        document.getElementById('playingTitle').innerText = `Playing: ${title}`;
        document.getElementById('controlsRow').style.display = 'flex';
        document.getElementById('playerWrapper').style.display = 'block';
        
        const animeGroup = document.getElementById('animeToggleGroup');
        const seasonGroup = document.getElementById('seasonGroup');
        const episodeGroup = document.getElementById('episodeGroup');

        if (type === 'anime') {
            animeGroup.style.display = 'flex';
        } else {
            animeGroup.style.display = 'none';
        }

        if (type === 'movie') {
            seasonGroup.style.display = 'none';
            episodeGroup.style.display = 'none';
            updatePlayerSource();
        } else {
            seasonGroup.style.display = 'flex';
            episodeGroup.style.display = 'flex';
            await loadSeasonsAndEpisodes(showId);
        }
    }

    async function loadSeasonsAndEpisodes(showId) {
        const seasonSelect = document.getElementById('seasonChooser');
        seasonSelect.innerHTML = "";

        try {
            const response = await fetch(`https://api.tvmaze.com/shows/${showId}/seasons`);
            if (!response.ok) throw new Error("Could not fetch seasons");
            
            seasonsData = await response.json();

            if (seasonsData.length === 0) {
                // Fallback default if API has no explicit season list
                const opt = document.createElement('option');
                opt.value = 1;
                opt.textContent = "1";
                seasonSelect.appendChild(opt);
                populateEpisodes(12);
                return;
            }

            seasonsData.forEach((s) => {
                const opt = document.createElement('option');
                opt.value = s.number;
                opt.textContent = s.number;
                seasonSelect.appendChild(opt);
            });

            handleSeasonChange();

        } catch (err) {
            console.warn("Seasons fetch failed, using fallback dropdowns.", err);
            seasonSelect.innerHTML = `<option value="1">1</option>`;
            populateEpisodes(24);
        }
    }

    function handleSeasonChange() {
        const selectedSeasonNum = parseInt(document.getElementById('seasonChooser').value, 10);
        const seasonObj = seasonsData.find(s => s.number === selectedSeasonNum);
        
        const episodeCount = (seasonObj && seasonObj.episodeOrder) ? seasonObj.episodeOrder : 24;
        populateEpisodes(episodeCount);
        updatePlayerSource();
    }

    function populateEpisodes(count) {
        const episodeSelect = document.getElementById('episodeChooser');
        episodeSelect.innerHTML = "";

        for (let i = 1; i <= count; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            episodeSelect.appendChild(opt);
        }
    }

    function updatePlayerSource() {
        if (!currentImdbId) return;

        const server = document.getElementById('serverChooser').value;
        const animeFormat = document.getElementById('animeFormat').value;
        const season = document.getElementById('seasonChooser').value || 1;
        const episode = document.getElementById('episodeChooser').value || 1;
        const videoPlayer = document.getElementById('videoPlayer');
        
        const customParams = "?primaryColor=38bdf8&secondaryColor=170000&iconColor=38bdf8&icons=vid&nextbutton=true";

        if (server === 'vidlink') {
            if (currentMediaType === 'movie') {
                videoPlayer.src = `https://vidlink.pro/movie/${currentTmdbId}${customParams}`;
            } else if (currentMediaType === 'anime') {
                videoPlayer.src = `https://vidlink.pro/anime/${currentTmdbId}/${season}/${episode}/${animeFormat}${customParams}`;
            } else {
                videoPlayer.src = `https://vidlink.pro/tv/${currentTmdbId}/${season}/${episode}${customParams}`;
            }
        } else if (server === 'otakuvid') {
            const subDubParam = (animeFormat === 'sub') ? 'sub' : 'dub';
            videoPlayer.src = `https://otakuvid.online/embed/${currentTmdbId}/${season}/${episode}?type=${subDubParam}`;
        } else if (server === 'multiembed') {
            videoPlayer.src = (currentMediaType === 'movie') 
                ? `https://multiembed.mov/?video_id=${currentImdbId}` 
                : `https://multiembed.mov/?video_id=${currentImdbId}&s=${season}&e=${episode}`;
        } else if (server === 'vidsrcpm') {
            videoPlayer.src = (currentMediaType === 'movie') 
                ? `https://vidsrc.pm/embed/movie/${currentImdbId}` 
                : `https://vidsrc.pm/embed/tv/${currentImdbId}/${season}/${episode}`;
        } else if (server === 'vidsrcin') {
            videoPlayer.src = (currentMediaType === 'movie') 
                ? `https://vidsrc.in/embed/movie/${currentImdbId}` 
                : `https://vidsrc.in/embed/tv/${currentImdbId}/${season}/${episode}`;
        }
    }

    window.onload = () => searchMedia();
</script>

</body>
</html>
