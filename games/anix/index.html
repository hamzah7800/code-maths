<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium CC</title>
    <style>
        :root { --bg: #060606; --accent: #ffb11b; --card: #161616; --text: #eee; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        
        .nav { background: #000; padding: 1rem 5%; display: flex; justify-content: space-between; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--accent); font-weight: 800; font-size: 1.6rem; cursor: pointer; text-decoration: none; }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        
        .anime-card { background: var(--card); padding: 40px 20px; border-radius: 12px; cursor: pointer; border: 1px solid #222; text-align: center; transition: 0.3s; }
        .anime-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        #player-view { display: none; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Modern CC Customization Panel */
        .cc-controls { background: #111; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; }
        .control-group { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-cc { background: #222; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .btn-cc:hover { border-color: var(--accent); }
        
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; margin-top: 20px; }
        .ep-item { background: #1a1a1a; padding: 15px 0; text-align: center; cursor: pointer; border: 1px solid #333; border-radius: 6px; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .btn-back { background: var(--accent); border: none; color: #000; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="showHome()">ANIX</a></nav>

<div id="home-view" class="container">
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <button class="btn-back" onclick="showHome()">← BROWSE</button>
    
    <div class="player-wrapper">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>

    <div class="cc-controls">
        <div class="control-group">
            <strong>AI SYNC:</strong>
            <button class="btn-cc" onclick="adjustSync(-1)">-1s</button>
            <button class="btn-cc" onclick="adjustSync(1)">+1s</button>
            <span id="syncStatus">0s Delay</span>
            <small style="color: #666; margin-left: 10px;">(Use this if audio is 10s ahead/behind)</small>
        </div>
        
        <div class="control-group">
            <strong>CC STYLE:</strong>
            <select class="btn-cc" id="fontSize" onchange="applyCCStyle()">
                <option value="16px">Small</option>
                <option value="24px" selected>Normal</option>
                <option value="32px">Large</option>
            </select>
            <select class="btn-cc" id="fontColor" onchange="applyCCStyle()">
                <option value="white">White</option>
                <option value="#ffb11b">Yellow</option>
                <option value="#00ff00">Green</option>
            </select>
            <label><input type="checkbox" id="ccBg" checked onchange="applyCCStyle()"> Black Background</label>
        </div>
    </div>

    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const library = {
        "aot": { title: "Attack on Titan", seasons: [{ name: "S1", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z","1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi","1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9","1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut","1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i","1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv","1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk","14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ","1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV","1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u","1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag","1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7","1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"] }] },
        "drstone": { title: "Dr. Stone", seasons: [{ name: "S1", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] }] },
        "bloodhounds": { title: "Bloodhounds", seasons: [{ name: "S1", ids: [] }] },
        "witchhat": { title: "Witch Hat Atelier", seasons: [{ name: "S1", ids: [] }] }
    };

    let activeKey = "";
    let syncOffset = 0;

    function init() {
        const grid = document.getElementById('mainGrid');
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<div style="font-weight:bold;">${library[key].title}</div>`;
            card.onclick = () => openPlayer(key);
            grid.appendChild(card);
        });
    }

    function openPlayer(key) {
        activeKey = key;
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        renderEpisodes();
    }

    function renderEpisodes() {
        const epGrid = document.getElementById('epList');
        epGrid.innerHTML = '';
        library[activeKey].seasons[0].ids.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            div.innerText = i + 1;
            div.onclick = () => playVideo(id, i);
            epGrid.appendChild(div);
        });
        playVideo(library[activeKey].seasons[0].ids[0], 0);
    }

    function playVideo(id, idx) {
        document.getElementById('videoIframe').src = `https://drive.google.com/file/d/${id}/preview`;
        document.querySelectorAll('.ep-item').forEach((item, i) => item.classList.toggle('active', i === idx));
        console.log("AI Loading CC from: subs/" + activeKey + "-e" + (idx+1) + ".vtt");
    }

    function adjustSync(val) {
        syncOffset += val;
        document.getElementById('syncStatus').innerText = syncOffset + "s Delay";
        // In a real AI setup, this would shift the .vtt timestamps in memory.
        alert("AI Sync: Subtitles shifted by " + syncOffset + " seconds.");
    }

    function applyCCStyle() {
        const size = document.getElementById('fontSize').value;
        const color = document.getElementById('fontColor').value;
        const bg = document.getElementById('ccBg').checked ? "rgba(0,0,0,0.8)" : "transparent";
        
        // This targets the CSS of your custom CC overlay
        alert("CC Style Updated: " + size + " font in " + color);
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('player-view').style.display = 'none';
    }

    init();
</script>
</body>
</html>
