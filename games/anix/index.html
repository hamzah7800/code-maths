<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Attack on Titan</title>
    <style>
        :root {
            --bg: #0b0c10;
            --accent: #00bcd4;
            --panel: #1b1b22;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: #fff;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* --- Navbar --- */
        .navbar { 
            background: #16161d; padding: 15px 30px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #2a2a35;
        }
        .logo { 
            font-weight: 900; color: var(--accent); 
            text-decoration: none; font-size: 20px;
        }

        /* --- Main Player Container --- */
        .main-container { 
            max-width: 1100px; width: 100%; margin: 20px auto; 
            padding: 0 20px; box-sizing: border-box;
        }
        
        .video-box { 
            background: #000; width: 100%; aspect-ratio: 16/9; 
            border-radius: 12px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- Episode Section --- */
        .ep-section { margin-top: 30px; padding-bottom: 50px; }
        .ep-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
            gap: 12px; margin-top: 15px; 
        }
        .ep-item { 
            background: #222; padding: 15px 0; text-align: center; 
            cursor: pointer; border-radius: 6px; transition: 0.2s;
            border: 1px solid #333; font-weight: bold;
        }
        .ep-item.active { 
            background: var(--accent); color: #000; 
            border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
        }
        .ep-item:hover { background: #333; border-color: var(--accent); }

        h3 { border-left: 4px solid var(--accent); padding-left: 10px; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">◁ ANIX HUB</a>
    <div id="curTitle" style="font-size: 14px; color: #ccc;">Attack on Titan - Episode 1</div>
</div>

<div class="main-container">
    <div class="video-box">
        <iframe id="videoIframe" src="https://drive.google.com/file/d/1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX/preview" allow="autoplay" allowfullscreen></iframe>
    </div>

    <div class="ep-section">
        <h3>Season 1 Episodes</h3>
        <div class="ep-grid" id="epList"></div>
    </div>
</div>

<script>
    // --- DATABASE: IDs you provided ---
    const aotDriveIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", // Ep 1
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", // Ep 2
        "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh", // Ep 3
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", // Ep 4
        "1niPlio07f_99u1-OtW_54uWkJwBouocx", // Ep 5
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", // Ep 6
        "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ"  // Ep 7 (Extracted from link)
    ];

    const iframe = document.getElementById('videoIframe');
    const epList = document.getElementById('epList');
    const titleText = document.getElementById('curTitle');

    // --- Generate Episode Buttons ---
    aotDriveIds.forEach((id, index) => {
        const epNum = index + 1;
        const div = document.createElement('div');
        div.className = 'ep-item' + (epNum === 1 ? ' active' : '');
        div.innerText = epNum;

        div.onclick = () => {
            // Update Active UI
            document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
            div.classList.add('active');
            
            // Update Title
            titleText.innerText = `Attack on Titan - Episode ${epNum}`;

            // Change Iframe Source
            iframe.src = `https://drive.google.com/file/d/${id}/preview`;
        };

        epList.appendChild(div);
    });
</script>

</body>
</html>
