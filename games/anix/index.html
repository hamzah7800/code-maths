<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Premium</title>
    <style>
        :root { --bg: #0a0a0c; --accent: #ffb11b; --card: #151517; --text: #d1d1d1; --panel: #1a1a1e; }
        
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        
        /* Sleek Header */
        .nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; cursor: pointer; text-decoration: none; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        
        /* Premium Cards (No Images) */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
        .anime-card { 
            background: var(--card); padding: 40px 20px; border-radius: 12px; cursor: pointer; 
            border: 1px solid #252525; text-align: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anime-card:hover { border-color: var(--accent); background: #1c1c20; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .anime-card div { font-weight: 700; font-size: 1.1rem; color: #fff; }

        #player-view { display: none; animation: fadeIn 0.4s ease; }
        
        /* Modern Video Shell */
        .player-container { background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid #333; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* AI Sync Control Bar */
        .ai-sync-bar { 
            background: var(--panel); margin-top: -10px; padding: 15px 25px; 
            border-radius: 0 0 16px 16px; display: flex; align-items: center; 
            justify-content: space-between; border: 1px solid #333; border-top: none;
        }
        .sync-label { font-size: 0.75rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .sync-controls { display: flex; align-items: center; gap: 12px; }
        .sync-btn { 
            background: #2a2a2e; border: 1px solid #444; color: #fff; padding: 6px 14px; 
            border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        .sync-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        #syncDisplay { font-family: monospace; font-weight: bold; min-width: 60px; text-align: center; }

        /* Episode List */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 2rem; }
        .ep-item { 
            background: var(--card); padding: 18px 0; text-align: center; cursor: pointer; 
            border: 1px solid #333; border-radius: 8px; font-weight: 600; transition: 0.2s;
        }
        .ep-item:hover { border-color: #555; }
        .ep-item.active { background: var(--accent); color: #000; border-color: var(--accent); }
        
        .back-nav { margin-bottom: 1.5rem; display: flex; align-items: center; cursor: pointer; color: var(--accent); font-weight: 700; font-size: 0.9rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="showHome()">ANIX</a></nav>

<div id="home-view" class="container">
    <div class="anime-grid" id="mainGrid"></div>
</div>

<div id="player-view" class="container">
    <div class="back-nav" onclick="showHome()">← BACK TO LIBRARY</div>
    
    <div class="player-container">
        <div class="player-wrapper">
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
        
        <div class="ai-sync-bar">
            <div class="sync-label">AI Timing Sync</div>
            <div class="sync-controls">
                <button class="sync-btn" onclick="offset(-5)">-5s</button>
                <button class="sync-btn" onclick="offset(-1)">-1s</button>
                <div id="syncDisplay">0.0s</div>
                <button class="sync-btn" onclick="offset(1)">+1s</button>
                <button class="sync-btn" onclick="offset(5)">+5s</button>
            </div>
            <div style="font-size: 0.7rem; color: #666;">OFFSET MODE: MANUAL</div>
        </div>
    </div>

    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const library = {
        "aot": { title: "Attack on Titan", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z","1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh","1tVuyPztBo_4ocftjOcEutI1zauSLpNDi","1niPlio07f_99u1-OtW_54uWkJwBouocx","1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9","1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ","1nsROetRCw6VEeT0zgDpiLVGng_zEQNut","1VHBr6nap3clpLaOYUjz32QE63SssHe-4","1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i","1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP","1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv","1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K","1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk","14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K","1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ","1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4","14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV","1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp","1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u","1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA","1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag","1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR","1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7","1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE"] },
        "drstone": { title: "Dr. Stone", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO", "1Ld99fPLtcxALJy9r2MsTPvBIr8ouF5IO"] },
        "bloodhounds": { title: "Bloodhounds", ids: [] },
        "witchhat": { title: "Witch Hat Atelier", ids: [] }
    };

    let activeKey = "";
    let currentSync = 0;

    function init() {
        const grid = document.getElementById('mainGrid');
        Object.keys(library).forEach(key => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `<div>${library[key].title}</div>`;
            card.onclick = () => openPlayer(key);
            grid.appendChild(card);
        });
    }

    function openPlayer(key) {
        activeKey = key;
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        
        const epGrid = document.getElementById('epList');
        epGrid.innerHTML = '';
        library[key].ids.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            div.innerText = i + 1;
            div.onclick = () => play(id, i);
            epGrid.appendChild(div);
        });
        play(library[key].ids[0], 0);
    }

    function play(id, idx) {
        document.getElementById('videoIframe').src = `https://drive.google.com/file/d/${id}/preview`;
        document.querySelectorAll('.ep-item').forEach((item, i) => item.classList.toggle('active', i === idx));
        // Reset sync on new episode
        currentSync = 0;
        updateSyncDisplay();
    }

    function offset(val) {
        currentSync += val;
        updateSyncDisplay();
        // Since we can't move Google's text, this serves as a reference.
        // If it's 10s off, you now know EXACTLY how much to shift your VTT file!
        console.log(`Subtitles need a ${currentSync}s shift in the VTT file.`);
    }

    function updateSyncDisplay() {
        document.getElementById('syncDisplay').innerText = (currentSync > 0 ? "+" : "") + currentSync + ".0s";
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoIframe').src = '';
    }

    init();
</script>
</body>
</html>
