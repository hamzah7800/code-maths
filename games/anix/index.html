<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | AI Live</title>
    <style>
        :root { --bg: #050505; --accent: #ffb11b; --panel: #111113; --text: #e0e0e0; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        
        .nav { background: #000; padding: 1rem 5%; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.8rem; text-decoration: none; cursor: pointer; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }
        
        /* Premium Player Shell */
        .player-shell { position: relative; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .video-box { width: 100%; aspect-ratio: 16/9; }
        iframe { width: 100%; height: 100%; border: none; }

        /* AI LIVE CC OVERLAY */
        #ai-caption-overlay {
            position: absolute; bottom: 15%; left: 0; width: 100%;
            text-align: center; pointer-events: none; z-index: 10;
        }
        .caption-text {
            display: inline-block; padding: 5px 15px; border-radius: 4px;
            background: rgba(0,0,0,0.8); color: #fff; font-size: 1.5rem;
            font-weight: 600; text-shadow: 2px 2px 4px #000;
            min-height: 20px; transition: all 0.1s ease;
        }

        /* AI Control Dashboard */
        .ai-dashboard { 
            background: var(--panel); padding: 20px; border-radius: 0 0 16px 16px; 
            border: 1px solid #333; border-top: none; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .ai-status { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; font-weight: bold; }
        .pulse { width: 10px; height: 10px; background: #888; border-radius: 50%; }
        .pulse.active { background: #00ff00; box-shadow: 0 0 10px #00ff00; animation: blink 1s infinite; }

        .ai-btn { 
            background: var(--accent); color: #000; border: none; padding: 10px 20px; 
            border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .ai-btn:hover { transform: scale(1.05); }

        /* Selection */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 2rem; }
        .ep-item { background: #151517; padding: 15px 0; text-align: center; border-radius: 8px; cursor: pointer; border: 1px solid #222; }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #home-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .anime-card { background: #111; padding: 40px 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #222; }
        #player-view { display: none; }
    </style>
</head>
<body>

<nav class="nav"><a class="logo" onclick="showHome()">ANIX</a></nav>

<div id="home-view" class="container"></div>

<div id="player-view" class="container">
    <div style="margin-bottom: 15px; cursor: pointer; color: var(--accent);" onclick="showHome()">← BACK</div>
    
    <div class="player-shell">
        <div class="video-box">
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
        
        <div id="ai-caption-overlay">
            <span class="caption-text" id="ai-output">AI Listening...</span>
        </div>
    </div>

    <div class="ai-dashboard">
        <div class="ai-status">
            <div id="ai-pulse" class="pulse"></div>
            <span id="ai-status-text">AI OFFLINE</span>
        </div>
        <button class="ai-btn" onclick="toggleAI()">START AI LIVE CC</button>
    </div>

    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const library = {
        "aot": { title: "Attack on Titan", ids: ["1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX","1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z"] },
        "drstone": { title: "Dr. Stone", ids: ["12etYKc9g_NHYJtwYKl1ix50V8ygmlmuO"] }
    };

    let recognition;
    let isAiActive = false;

    // AI Speech Model Logic
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            let current = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                current += event.results[i][0].transcript;
            }
            document.getElementById('ai-output').innerText = current;
        };

        recognition.onend = () => { if(isAiActive) recognition.start(); };
    }

    function toggleAI() {
        const pulse = document.getElementById('ai-pulse');
        const text = document.getElementById('ai-status-text');
        const btn = document.querySelector('.ai-btn');

        if (!isAiActive) {
            recognition.start();
            isAiActive = true;
            pulse.classList.add('active');
            text.innerText = "AI LIVE TRANScribing...";
            btn.innerText = "STOP AI";
            btn.style.background = "#ff4444";
        } else {
            recognition.stop();
            isAiActive = false;
            pulse.classList.remove('active');
            text.innerText = "AI OFFLINE";
            btn.innerText = "START AI LIVE CC";
            btn.style.background = "var(--accent)";
            document.getElementById('ai-output').innerText = "";
        }
    }

    // Navigation Logic
    function init() {
        const home = document.getElementById('home-view');
        Object.keys(library).forEach(key => {
            const div = document.createElement('div');
            div.className = 'anime-card';
            div.innerHTML = `<strong>${library[key].title}</strong>`;
            div.onclick = () => openPlayer(key);
            home.appendChild(div);
        });
    }

    function openPlayer(key) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        const list = document.getElementById('epList');
        list.innerHTML = '';
        library[key].ids.forEach((id, i) => {
            const ep = document.createElement('div');
            ep.className = 'ep-item';
            ep.innerText = i + 1;
            ep.onclick = () => {
                document.getElementById('videoIframe').src = `https://drive.google.com/file/d/${id}/preview`;
                document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
                ep.classList.add('active');
            };
            list.appendChild(ep);
        });
        list.firstChild.click();
    }

    function showHome() {
        document.getElementById('home-view').style.display = 'grid';
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoIframe').src = '';
        if(isAiActive) toggleAI();
    }

    init();
</script>
</body>
</html>
