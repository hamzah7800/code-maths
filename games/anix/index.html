<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | Time-Sync Player</title>
    <style>
        :root { --bg: #0b0c10; --accent: #00bcd4; --panel: #1b1b22; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; }
        
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent); }
        .logo { color: var(--accent); text-decoration: none; font-weight: 900; font-size: 22px; }

        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .video-box { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; }

        .status-bar { display: flex; justify-content: space-between; padding: 10px 5px; font-size: 13px; color: var(--accent); }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 12px; margin-top: 10px; }
        .ep-item { 
            background: #1a1a1a; padding: 15px 0; text-align: center; cursor: pointer; 
            border-radius: 8px; border: 1px solid #333; transition: 0.3s; position: relative;
        }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        .ep-item.completed::after {
            content: '✓'; position: absolute; top: 2px; right: 5px; font-size: 10px; color: #4caf50;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">ANIX</a>
    <div id="curTitle">Episode 1</div>
</div>

<div class="main-container">
    <div class="video-box">
        <video id="mainVideo" controls crossorigin="anonymous">
            <source src="" type="video/mp4">
        </video>
    </div>
    <div class="status-bar">
        <div id="memStatus">Auto-saving progress...</div>
        <div id="timeStatus">00:00</div>
    </div>

    <h3>Episodes</h3>
    <div class="ep-grid" id="epList"></div>
</div>

<script>
    const aotIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", "1riigEtCvxHY4m5XBE3nSWCBYw3rzZV8i",
        "1wcEn6TSdPqPDJ3m6RGtU5NsCO6rBklNP", "1U-X3qUGA2xPiy4oc-JEV1DhpGwUukoOv",
        "1rc6YUeJEYXLI7I4UjPPiAKAknj8PGp0K", "1ueI6BjGjpCGop3KPEetH2aMAs8EdumVk",
        "1VJ_OCFBt_vVreK_f7PJdimxi5ZPTjloQ", "1NpfySF0N3yRGLcUjHaIEWcXF6aLRacJ4",
        "14L5kOrzHV4JO04xO8Bo8ibvV0TrefpWV", "1n3hmxNN_uuIF7dOoxiKiOLOprBSDX1mp",
        "1sBFo-tXs_pR0Y2BUgdQZA-dgW_hJ9n1Z", "1o6Mgy_eKWV182EbTX6IUhU_D4tuNcd9u",
        "1nOuX42GUZf5yCL72yb3-TesXNKW1eEHA", "1yNAjadmeNTeTpeRyHY7Fi0nH2op0OMag",
        "1jMCsyNjy3Du0yN3o-DE9EgKXCeS5zTpR", "1IlUCW-o1kjOzAte682JQ_0yc4NJ1nvX7",
        "1zHq8sb4PV8p41DLejAjL6REoKwx5hoQE", "1ICpdFV8u6ddf-a0YwyiptlyDNQN-Whwh",
        "1tVuyPztBo_4ocftjOcEutI1zauSLpNDi", "1niPlio07f_99u1-OtW_54uWkJwBouocx",
        "1-qB_bxTFlZoRJWE0jTx8gildU78ElXt9", "1-P5fE4dRyvirGzlGkoTdsF6si9AwVpYJ",
        "1nsROetRCw6VEeT0zgDpiLVGng_zEQNut", "1VHBr6nap3clpLaOYUjz32QE63SssHe-4",
        "14B-b7seCN8VS2IgpPYewDwTtc4UWwz3K"
    ];

    const video = document.getElementById('mainVideo');
    const epList = document.getElementById('epList');
    const memStatus = document.getElementById('memStatus');
    let currentIdx = 0;

    // --- 1. SMART CHECKMARK SYSTEM ---
    // Get list of episodes actually finished
    let finished = JSON.parse(localStorage.getItem('anix_finished') || '[]');

    function loadEpisode(index) {
        currentIdx = index;
        const id = aotIds[index];
        
        // This direct link format is required for time-memory to work
        video.src = `https://drive.google.com/uc?export=download&id=${id}`;
        document.getElementById('curTitle').innerText = `Episode ${index + 1}`;
        
        // Resume from saved time
        const savedTime = localStorage.getItem(`time_ep_${index}`);
        if (savedTime) {
            video.currentTime = parseFloat(savedTime);
            memStatus.innerText = `Resumed at ${Math.floor(savedTime/60)}:${Math.floor(savedTime%60).toString().padStart(2,'0')}`;
        } else {
            memStatus.innerText = "New episode started";
        }

        updateUI();
        video.play().catch(() => memStatus.innerText = "Click Play to Resume");
        localStorage.setItem('anix_last_viewed', index);
    }

    // --- 2. THE MEMORY TRACKER ---
    video.ontimeupdate = () => {
        const time = video.currentTime;
        if (time > 5) { // Only start saving after 5 seconds
            localStorage.setItem(`time_ep_${currentIdx}`, time);
        }

        // Only mark as "Finished" if watched more than 10 minutes (600 seconds)
        if (time > 600 && !finished.includes(currentIdx)) {
            finished.push(currentIdx);
            localStorage.setItem('anix_finished', JSON.stringify(finished));
            updateUI();
        }

        // Update time display
        const mins = Math.floor(time / 60);
        const secs = Math.floor(time % 60);
        document.getElementById('timeStatus').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
    };

    function updateUI() {
        epList.innerHTML = '';
        aotIds.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            if (i === currentIdx) div.classList.add('active');
            if (finished.includes(i)) div.classList.add('completed');
            div.innerText = i + 1;
            div.onclick = () => loadEpisode(i);
            epList.appendChild(div);
        });
    }

    // Initialize
    const startEp = localStorage.getItem('anix_last_viewed') || 0;
    loadEpisode(parseInt(startEp));

</script>

</body>
</html>
