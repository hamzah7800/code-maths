<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIX | AI Anime Player</title>
    <style>
        :root {
            --bg: #0b0c10;
            --accent: #00bcd4;
            --panel: #1b1b22;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: #fff;
        }

        /* --- Navbar --- */
        .navbar { 
            background: #16161d; padding: 15px 30px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #2a2a35;
        }
        .logo { 
            font-weight: 900; color: var(--accent); 
            text-decoration: none; font-size: 20px;
        }

        /* --- Player Area --- */
        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .video-box { 
            background: #000; width: 100%; aspect-ratio: 16/9; 
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- Episodes --- */
        .ep-section { margin-top: 30px; }
        .ep-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
            gap: 10px; margin-top: 15px; 
        }
        .ep-item { 
            background: #222; padding: 12px; text-align: center; 
            cursor: pointer; border-radius: 5px; transition: 0.2s;
            border: 1px solid #333;
        }
        .ep-item.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        .ep-item:hover { background: #333; border-color: var(--accent); }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/code-maths/" class="logo">◁ ANIX HUB</a>
    <div id="curTitle">Attack on Titan - Episode 1</div>
</div>

<div class="main-container">
    <div class="video-box">
        <iframe id="videoIframe" src="https://drive.google.com/file/d/1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX/preview" allow="autoplay"></iframe>
    </div>

    <div class="ep-section">
        <h3>Episodes</h3>
        <div class="ep-grid" id="epList"></div>
    </div>
</div>

<script>
    // 1. ADD YOUR FILE IDs HERE
    const aotDriveIds = [
        "1_motPglkqFZAtlvOyoVG4Do8ZP88dMGX", // Ep 1 (The one you sent)
        "PASTE_ID_FOR_EP_2",
        "PASTE_ID_FOR_EP_3",
        // ... add the rest
    ];

    const iframe = document.getElementById('videoIframe');
    const epList = document.getElementById('epList');
    const titleText = document.getElementById('curTitle');

    // 2. GENERATE BUTTONS
    aotDriveIds.forEach((id, index) => {
        const epNum = index + 1;
        const div = document.createElement('div');
        div.className = 'ep-item' + (epNum === 1 ? ' active' : '');
        div.innerText = epNum;

        div.onclick = () => {
            // Update UI
            document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
            div.classList.add('active');
            titleText.innerText = `Attack on Titan - Episode ${epNum}`;

            // Update Iframe Source to the Preview Link
            iframe.src = `https://drive.google.com/file/d/${id}/preview`;
        };

        epList.appendChild(div);
    });
</script>

</body>
</html>
