<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<style>
    /* Premium Player Styling */
    .video-container { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
    /* Fix for Google Drive aspect ratio */
    .plyr__video-embed { aspect-ratio: 16/9; }
</style>

<div class="player-wrapper">
    <div class="video-container">
        <div id="player" data-plyr-provider="google" data-plyr-embed-id=""></div>
    </div>
</div>

<script>
    // Initialize the Pro Player
    const player = new Plyr('#player', {
        captions: { active: true, update: true, language: 'en' }
    });

    // UPDATED playVideo Function
    function playVideo(id, idx) {
        const anime = library[activeKey];
        const seasonName = anime.seasons[activeSeason].name.toLowerCase().replace(" ", "");
        
        // 1. Change the Video ID
        player.source = {
            type: 'video',
            sources: [{
                src: id,
                provider: 'google',
            }],
            // 2. THIS INJECTS YOUR LOCAL CC
            tracks: [{
                kind: 'captions',
                label: 'English AI',
                srclang: 'en',
                src: `subs/${activeKey}-${seasonName}-e${idx + 1}.vtt`, // Matches your file name
                default: true,
            }]
        };

        // UI Updates
        localStorage.setItem(`last_${activeKey}_ep`, idx);
        document.querySelectorAll('.ep-item').forEach((item, i) => {
            item.classList.toggle('active', i == idx);
        });
    }
</script>
