<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            /* Minimal styling to center the game */
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameCanvas {
            border: 1px solid black;
            background-color: #e0ffff; /* Light blue sky */
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        // *** Game Logic Goes Here ***
        
        // 1. Setup Canvas and Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // 2. Game Variables (Gravity, Speed, Score, Game State)
        let doodler;
        let platforms = [];
        let gravity = 0.5;
        let jumpPower = -12;
        let score = 0;
        let isGameOver = false;

        // 3. Doodler Object/Class
        // Store properties like x, y, width, height, velocity (dy), and a draw method.
        class Doodler {
            constructor() {
                this.x = width / 2 - 20;
                this.y = height - 100;
                this.width = 40;
                this.height = 40;
                this.dy = 0; // Vertical velocity
                this.dx = 0; // Horizontal velocity
            }
            
            draw() {
                // Simple yellow rectangle for the doodler
                ctx.fillStyle = 'yellow';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                // Apply gravity
                this.dy += gravity;
                this.y += this.dy;

                // Handle screen wrap for horizontal movement
                if (this.x + this.width < 0) {
                    this.x = width;
                } else if (this.x > width) {
                    this.x = -this.width;
                }
            }
        }
        
        // 4. Platform Object/Class
        // Store properties like x, y, width, height, and a draw method.
        class Platform {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 10;
            }
            
            draw() {
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // 5. Initialize Game and Platforms
        function createPlatforms() {
            // Create initial platforms evenly spaced
            for (let i = 0; i < 10; i++) {
                let x = Math.random() * (width - 60);
                let y = height - (i * 60) - 60;
                platforms.push(new Platform(x, y));
            }
        }

        function init() {
            doodler = new Doodler();
            platforms = [];
            createPlatforms();
            score = 0;
            isGameOver = false;
            // Start the game loop
            gameLoop();
        }

        // 6. Collision Detection Logic
        function checkCollisions() {
            platforms.forEach(platform => {
                // Check if doodler is falling and is above the platform
                if (doodler.dy > 0 && 
                    doodler.y + doodler.height >= platform.y && 
                    doodler.y + doodler.height <= platform.y + platform.height && 
                    doodler.x < platform.x + platform.width && 
                    doodler.x + doodler.width > platform.x) 
                {
                    // Bounce/Jump
                    doodler.dy = jumpPower; 
                }
            });
        }

        // 7. Platform Scrolling and Generation
        function scrollPlatforms() {
            // If doodler moves past the middle of the screen while moving up
            if (doodler.y < height / 2 && doodler.dy < 0) {
                // Move platforms (and doodler) down, and track score
                platforms.forEach(platform => {
                    platform.y -= doodler.dy; // move platforms down by the doodler's upward speed
                });
                score += Math.floor(-doodler.dy * 0.1); // Increase score
                doodler.y = height / 2; // Keep the doodler near the center

                // Generate new platforms at the top
                if (platforms[platforms.length - 1].y > 0) {
                     let x = Math.random() * (width - 60);
                     let y = platforms[platforms.length - 1].y - 60; // place above the last platform
                     platforms.push(new Platform(x, y));
                }
            }

            // Remove off-screen platforms
            platforms = platforms.filter(platform => platform.y < height);
        }

        // 8. Game Over Logic
        function checkGameOver() {
            if (doodler.y > height) {
                isGameOver = true;
            }
        }

        // 9. Main Game Loop
        function gameLoop() {
            if (isGameOver) {
                ctx.fillStyle = 'red';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', width / 2, height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Score: ' + score, width / 2, height / 2 + 40);
                ctx.fillText('Press SPACE to Restart', width / 2, height / 2 + 80);
                return; // Stop the loop
            }

            // Clear the canvas
            ctx.clearRect(0, 0, width, height);

            // Update & Draw
            doodler.update();
            checkCollisions();
            scrollPlatforms();
            checkGameOver();
            
            doodler.draw();
            platforms.forEach(platform => platform.draw());

            // Draw Score
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.fillText('Score: ' + score, 10, 25);
            
            requestAnimationFrame(gameLoop);
        }
        
        // 10. Input Handling (Keyboard)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                doodler.dx = -5; // Move left
            } else if (e.key === 'ArrowRight') {
                doodler.dx = 5; // Move right
            } else if (e.key === ' ' && isGameOver) {
                init(); // Restart game
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                doodler.dx = 0; // Stop horizontal movement
            }
        });

        // 11. Start the Game
        init();

    </script>
</body>
</html>
