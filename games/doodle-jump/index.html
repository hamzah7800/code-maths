<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump Web</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #87ceeb;
    font-family: sans-serif;
  }
  canvas {
    display: block;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
    color: #000;
  }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 400;
canvas.height = 600;

const scoreElement = document.getElementById('score');
let score = 0;

// Player
const player = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 60,
  width: 50,
  height: 50,
  velY: 0,
  speed: 5,
  color: 'black'
};

// Gravity & jump
const gravity = 0.5;
const jumpStrength = -10;

// Platforms
const platforms = [];
const platformCount = 7;
const platformWidth = 100;
const platformHeight = 10;

// Enemies
const enemies = [];

// Power-ups
const powerUps = [];

// Initialize platforms
for (let i = 0; i < platformCount; i++) {
  platforms.push({
    x: Math.random() * (canvas.width - platformWidth),
    y: i * (canvas.height / platformCount),
    width: platformWidth,
    height: platformHeight,
    color: 'green'
  });
}

// Key input
const keys = { left: false, right: false };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

// Game loop
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Player movement
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;

  player.velY += gravity;
  player.y += player.velY;

  // Platform collision
  platforms.forEach(plat => {
    if (
      player.y + player.height >= plat.y &&
      player.y + player.height <= plat.y + plat.height &&
      player.x + player.width > plat.x &&
      player.x < plat.x + plat.width &&
      player.velY > 0
    ) {
      player.y = plat.y - player.height;
      player.velY = jumpStrength;
      score += 10; // Increase score on jump
      scoreElement.textContent = "Score: " + score;
    }
  });

  // Scroll platforms
  if (player.y < canvas.height / 2) {
    const offset = canvas.height / 2 - player.y;
    player.y = canvas.height / 2;
    platforms.forEach(plat => {
      plat.y += offset;
      if (plat.y > canvas.height) {
        plat.y = 0;
        plat.x = Math.random() * (canvas.width - platformWidth);

        // Chance to spawn enemy or power-up
        if (Math.random() < 0.2) {
          enemies.push({
            x: plat.x + Math.random() * (platformWidth - 30),
            y: 0,
            width: 30,
            height: 30,
            color: 'red',
            speed: 2
          });
        }
        if (Math.random() < 0.1) {
          powerUps.push({
            x: plat.x + Math.random() * (platformWidth - 20),
            y: 0,
            width: 20,
            height: 20,
            color: 'gold'
          });
        }
      }
    });
  }

  // Draw platforms
  platforms.forEach(plat => {
    ctx.fillStyle = plat.color;
    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
  });

  // Draw player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Draw enemies
  enemies.forEach((enemy, i) => {
    enemy.y += enemy.speed;
    ctx.fillStyle = enemy.color;
    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

    // Collision with player
    if (
      player.x < enemy.x + enemy.width &&
      player.x + player.width > enemy.x &&
      player.y < enemy.y + enemy.height &&
      player.y + player.height > enemy.y
    ) {
      alert("Game Over! Score: " + score);
      document.location.reload();
    }

    // Remove offscreen enemies
    if (enemy.y > canvas.height) enemies.splice(i, 1);
  });

  // Draw power-ups
  powerUps.forEach((power, i) => {
    power.y += 1;
    ctx.fillStyle = power.color;
    ctx.fillRect(power.x, power.y, power.width, power.height);

    // Collision with player
    if (
      player.x < power.x + power.width &&
      player.x + player.width > power.x &&
      player.y < power.y + power.height &&
      player.y + player.height > power.y
    ) {
      score += 50; // Extra points
      scoreElement.textContent = "Score: " + score;
      powerUps.splice(i, 1);
    }

    // Remove offscreen power-ups
    if (power.y > canvas.height) powerUps.splice(i, 1);
  });

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
