<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            /* Minimal styling to center the game */
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column; /* Stack canvas and joystick */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            border: 1px solid black;
            background-color: #e0ffff; /* Light blue sky */
            touch-action: none; /* Prevent default mobile scroll/zoom behavior */
        }

        /* -------------------------------------- */
        /* CSS for the Mobile/Touch Joystick Area */
        /* -------------------------------------- */
        #joystick {
            /* Positioned below the canvas for easy access on mobile */
            margin-top: 15px; 
            width: 300px;
            height: 50px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection */
            z-index: 10; /* Ensure it is above other elements */
        }
        .joystick-button {
            width: 100px;
            height: 40px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            line-height: 40px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #aaa;
            transition: all 0.05s;
            color: #333;
        }
        .joystick-button:active {
            box-shadow: 0 2px #888;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="joystick">
        <div class="joystick-button" id="left-button">← Left (A)</div>
        <div class="joystick-button" id="right-button">Right (D) →</div>
    </div>

    <script>
        // *** Game Setup ***
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const leftButton = document.getElementById('left-button');
        const rightButton = document.getElementById('right-button');

        // Core Game Variables
        let doodler;
        let platforms = [];
        const gravity = 0.5;
        const jumpPower = -12; // Negative for upward velocity
        let score = 0;
        let isGameOver = false;
        const horizontalSpeed = 5;

        // -----------------------------------------------------------------
        // Doodler and Platform Classes
        // -----------------------------------------------------------------

        class Doodler {
            constructor() {
                this.x = width / 2 - 20;
                this.y = height - 100;
                this.width = 40;
                this.height = 40;
                this.dy = 0; // Vertical velocity (change in Y)
                this.dx = 0; // Horizontal velocity (change in X)
            }
            
            draw() {
                // Draw a simple yellow square Doodler
                ctx.fillStyle = 'yellow';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                // Apply physics: Gravity affects vertical velocity (dy)
                this.dy += gravity;
                this.y += this.dy;

                // Apply horizontal movement (dx)
                this.x += this.dx;

                // Screen wrap: If doodler moves off one side, it appears on the other
                if (this.x + this.width < 0) {
                    this.x = width;
                } else if (this.x > width) {
                    this.x = -this.width;
                }
            }
        }
        
        class Platform {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 10;
            }
            
            draw() {
                // Draw a simple green platform
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // -----------------------------------------------------------------
        // Game Initialization
        // -----------------------------------------------------------------

        function createPlatforms() {
            // 1. Create the guaranteed starting platform at the bottom
            const startPlatformX = width / 2 - 30;
            const startPlatformY = height - 50;
            platforms.push(new Platform(startPlatformX, startPlatformY));

            // 2. Create the remaining platforms above the starting one
            for (let i = 1; i < 10; i++) {
                let x = Math.random() * (width - 60);
                let y = height - (i * 60) - 60; 
                platforms.push(new Platform(x, y));
            }
        }

        function init() {
            doodler = new Doodler();
            platforms = [];
            createPlatforms();
            score = 0;
            isGameOver = false;
            
            // Place doodler on the starting platform and give an initial bounce
            const startPlatform = platforms[0];
            doodler.x = startPlatform.x + (startPlatform.width / 2) - (doodler.width / 2);
            doodler.y = startPlatform.y - doodler.height;
            doodler.dy = jumpPower; // Initial jump to start the game

            // Start the game loop
            requestAnimationFrame(gameLoop);
        }

        // -----------------------------------------------------------------
        // Game Logic
        // -----------------------------------------------------------------

        function checkCollisions() {
            platforms.forEach(platform => {
                // Collision check: 
                // 1. Doodler is falling (dy > 0)
                // 2. Doodler's bottom touches or passes the platform's top
                // 3. Doodler's horizontal position overlaps the platform
                if (doodler.dy > 0 && 
                    doodler.y + doodler.height >= platform.y && 
                    doodler.y + doodler.height <= platform.y + platform.height && 
                    doodler.x < platform.x + platform.width && 
                    doodler.x + doodler.width > platform.x) 
                {
                    // Bounce/Jump
                    doodler.dy = jumpPower; 
                }
            });
        }

        function scrollPlatforms() {
            // Screen scrolling logic: only scroll when doodler moves past the middle while moving up
            if (doodler.y < height / 2 && doodler.dy < 0) {
                // Move platforms down, and track score
                platforms.forEach(platform => {
                    platform.y -= doodler.dy; // Move platforms down by the doodler's upward speed
                });
                score += Math.floor(-doodler.dy * 0.1); // Score based on distance traveled up
                doodler.y = height / 2; // Keep the doodler near the center

                // Generate new platform at the top
                const lastPlatform = platforms[platforms.length - 1];
                if (lastPlatform && lastPlatform.y > 0) {
                     let x = Math.random() * (width - 60);
                     let y = lastPlatform.y - 60; // Place above the last platform
                     platforms.push(new Platform(x, y));
                }
            }

            // Clean up: Remove platforms that have scrolled off the bottom
            platforms = platforms.filter(platform => platform.y < height);
        }

        function checkGameOver() {
            // Game Over if the doodler falls below the bottom of the screen
            if (doodler.y > height) {
                isGameOver = true;
            }
        }

        // -----------------------------------------------------------------
        // Main Game Loop
        // -----------------------------------------------------------------

        function gameLoop() {
            if (isGameOver) {
                // Game Over Screen
                ctx.clearRect(0, 0, width, height); 
                ctx.fillStyle = 'red';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', width / 2, height / 2);
                ctx.fillStyle = 'black';
                ctx.font = '24px Arial';
                ctx.fillText('Final Score: ' + score, width / 2, height / 2 + 40);
                ctx.fillText('Press SPACE or Tap to Restart', width / 2, height / 2 + 80);
                return; 
            }

            // Clear the canvas
            ctx.clearRect(0, 0, width, height);

            // Update
            doodler.update();
            checkCollisions();
            scrollPlatforms();
            checkGameOver();
            
            // Draw
            doodler.draw();
            platforms.forEach(platform => platform.draw());

            // Draw Score
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Score: ' + score, 10, 25);
            
            // Request the next frame for continuous animation
            requestAnimationFrame(gameLoop);
        }
        
        // -----------------------------------------------------------------
        // Input Handling (Keyboard & Touch)
        // -----------------------------------------------------------------

        // Keyboard Event Handlers (Arrow keys and WASD)
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') {
                doodler.dx = -horizontalSpeed; // Move left
            } else if (key === 'arrowright' || key === 'd') {
                doodler.dx = horizontalSpeed; // Move right
            } else if (key === ' ' && isGameOver) {
                init(); // Restart game on Spacebar
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a' || 
                key === 'arrowright' || key === 'd') {
                doodler.dx = 0; // Stop horizontal movement when key is released
            }
        });
        
        // Mobile/Joystick Logic
        function startMoving(direction) {
            if (isGameOver) return;
            doodler.dx = direction === 'left' ? -horizontalSpeed : horizontalSpeed;
        }

        function stopMoving() {
            doodler.dx = 0;
        }

        // Joystick controls for Left Button (Mouse and Touch)
        leftButton.addEventListener('mousedown', () => startMoving('left'));
        leftButton.addEventListener('mouseup', stopMoving);
        leftButton.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving('left'); });
        leftButton.addEventListener('touchend', stopMoving);

        // Joystick controls for Right Button (Mouse and Touch)
        rightButton.addEventListener('mousedown', () => startMoving('right'));
        rightButton.addEventListener('mouseup', stopMoving);
        rightButton.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving('right'); });
        rightButton.addEventListener('touchend', stopMoving);

        // Canvas click/tap to restart on Game Over for mobile
        canvas.addEventListener('click', () => {
            if (isGameOver) {
                init();
            }
        });


        // Start the Game when the page loads
        init();

    </script>
</body>
</html>
