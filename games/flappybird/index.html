<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird Easy Mode</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #70c5ce;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      background: #70c5ce;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 24px;
      text-align: center;
      pointer-events: none;
    }
    #gameOver {
      font-size: 32px;
      margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="gameOver" class="hidden">Game Over! Tap or press Space to restart.</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let cw = (canvas.width = window.innerWidth);
    let ch = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    });

    // Game settings (easier)
    const gravity = 0.4;
    const flapStrength = -11; // stronger flap
    let bird, pipes, frameCount, score, gameOver;

    // Ground
    let groundX = 0;
    const groundHeight = 100;
    const groundSpeed = 2.5; // slower for easier play

    function drawGround() {
      groundX = (groundX - groundSpeed) % cw;
      ctx.fillStyle = "#DEB887";
      ctx.fillRect(groundX, ch - groundHeight, cw, groundHeight);
      ctx.fillRect(groundX + cw, ch - groundHeight, cw, groundHeight);
    }

    // Bird object (OG style drawing)
    class Bird {
      constructor() {
        this.x = cw / 4;
        this.y = ch / 2;
        this.radius = 20;
        this.velocity = 0;
      }
      update() {
        this.velocity += gravity;
        this.y += this.velocity;
      }
      flap() {
        this.velocity = flapStrength;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.min(Math.max(this.velocity / 10, -0.3), 0.3));

        // Body (yellow oval)
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius + 5, this.radius, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wing (small yellow circle)
        ctx.fillStyle = "#FFEA00";
        ctx.beginPath();
        ctx.arc(-10, 5, 8, 0, Math.PI * 2);
        ctx.fill();

        // Eye (white)
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(10, -5, 8, 0, Math.PI * 2);
        ctx.fill();

        // Pupil (black)
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(12, -5, 3, 0, Math.PI * 2);
        ctx.fill();

        // Beak (orange triangle)
        ctx.fillStyle = "#FF8C00";
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(35, -5);
        ctx.lineTo(20, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    // Pipe object
    class Pipe {
      constructor() {
        this.topHeight = Math.random() * (ch / 2) + 50;
        this.gap = Math.random() * 40 + 200; // wider gap 200–240px
        this.bottomY = this.topHeight + this.gap;
        this.x = cw;
        this.width = 80;
        this.speed = 2.5; // slower pipes
      }
      update() {
        this.x -= this.speed;
      }
      draw() {
        ctx.fillStyle = "#4CAF50";
        // Top pipe
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        // Bottom pipe
        ctx.fillRect(this.x, this.bottomY, this.width, ch - this.bottomY - groundHeight);
      }
    }

    function init() {
      bird = new Bird();
      pipes = [];
      frameCount = 0;
      score = 0;
      gameOver = false;
      document.getElementById("score").innerText = "Score: 0";
      document.getElementById("gameOver").classList.add("hidden");
      animate();
    }

    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, cw, ch);

      // Update bird
      bird.update();
      bird.draw();

      // Add new pipes
      if (frameCount % 100 === 0) {
        pipes.push(new Pipe());
      }

      // Update and draw pipes
      pipes.forEach((pipe, index) => {
        pipe.update();
        pipe.draw();

        // Collision check
        if (
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + pipe.width &&
          (bird.y - bird.radius < pipe.topHeight ||
            bird.y + bird.radius > pipe.bottomY)
        ) {
          endGame();
        }

        // Score
        if (pipe.x + pipe.width < bird.x && !pipe.scored) {
          score++;
          pipe.scored = true;
          document.getElementById("score").innerText = "Score: " + score;
        }

        // Remove pipes
        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
        }
      });

      // Draw ground
      drawGround();

      // Ground collision
      if (bird.y + bird.radius >= ch - groundHeight || bird.y - bird.radius <= 0) {
        endGame();
      }

      frameCount++;
    }

    function endGame() {
      gameOver = true;
      document.getElementById("gameOver").classList.remove("hidden");
    }

    // Controls
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (gameOver) {
          init();
        } else {
          bird.flap();
        }
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (gameOver) {
        init();
      } else {
        bird.flap();
      }
    }, { passive: false });

    // Start game
    init();
  </script>
</body>
</html>
