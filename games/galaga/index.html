<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Galaga with Auto Fire</title>
<style>
  body { margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#000; display:block; }
</style>
</head>
<body>
<canvas id="game" width="500" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 230, y: 550, w: 40, h: 20, speed: 5 };
let bullets = [];
let enemies = [];
let score = 0;

// create enemies
for (let i = 0; i < 5; i++) {
  for (let j = 0; j < 3; j++) {
    enemies.push({ x: 60 + i * 80, y: 50 + j * 60, w: 30, h: 20, alive: true });
  }
}

// keyboard handling
let keys = {};
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  // B = twin laser (two small parallel shots)
  if (e.key.toLowerCase() === "b") {
    bullets.push({ x: player.x + 5, y: player.y, dy: -7, twin: true });
    bullets.push({ x: player.x + player.w - 7, y: player.y, dy: -7, twin: true });
  }

  // U = ultimate shot (big beam)
  if (e.key.toLowerCase() === "u") {
    bullets.push({ x: player.x + player.w/2 - 5, y: player.y, dy: -15, big: true });
  }
});
document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// auto fire normal bullets every 400ms
setInterval(() => {
  bullets.push({ x: player.x + player.w/2 - 1, y: player.y, dy: -7, normal: true });
}, 400);

// update game state
function update() {
  // player movement
  if (keys["a"] && player.x > 0) player.x -= player.speed;
  if (keys["d"] && player.x + player.w < canvas.width) player.x += player.speed;
  if (keys["w"] && player.y > 0) player.y -= player.speed;
  if (keys["s"] && player.y + player.h < canvas.height) player.y += player.speed;

  // bullets movement
  bullets.forEach(b => b.y += b.dy);
  bullets = bullets.filter(b => b.y > -20);

  // collisions with enemies
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.alive &&
          b.x < e.x + e.w && b.x + (b.big ? 10 : 3) > e.x &&
          b.y < e.y + e.h && b.y + 10 > e.y) {
        e.alive = false;
        b.y = -999; // remove bullet
        score += b.big ? 20 : (b.twin ? 15 : 10);
      }
    });
  });
}

// draw everything
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // draw player
  ctx.fillStyle = "lime";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // draw bullets
  ctx.fillStyle = "red";
  bullets.forEach(b => {
    if (b.big) {
      ctx.fillRect(b.x, b.y, 10, 30); // ultimate beam
    } else if (b.twin) {
      ctx.fillRect(b.x, b.y, 3, 10);  // twin laser
    } else {
      ctx.fillRect(b.x, b.y, 2, 10);  // normal auto bullet
    }
  });

  // draw enemies
  ctx.fillStyle = "cyan";
  enemies.forEach(e => {
    if (e.alive) ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  // draw score
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 20);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
