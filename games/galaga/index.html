<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WinWing Clone (Vanilla JS)</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; margin:0 auto; background:#111; }
  #ui { position:absolute; top:10px; left:10px; color:#fff; font:16px Arial; }
</style>
</head>
<body>
<canvas id="game" width="480" height="720"></canvas>
<div id="ui">Score: 0 | Lives: 3 | Power: 1</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');

// === Sprites (base64 PNGs) ===
const playerImg = new Image();
playerImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAwklEQVRYhe3XQQqDMBSF4Q8QhZDhMcbIL6ZAjIhsS0kUJOosLJfU8wpjHyBhA+ZscmNkbPKsRy2FRrRz2Ug9xK4AcdgDgOhQpgVslRzAefoBaUYN1Cmvxbyphuzl6hsjw7L0HS39BLChNFWQWJ+2FxwsHRhrM8G8MftUBlzNRQAtZfFgb+N4xVlzAph0iHhXe2m0gzLdsBZ5Qx2u/HLjq1J6nADQAgYiCObVZC0QAAAABJRU5ErkJggg==";

const enemyImg = new Image();
enemyImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAdCAYAAABo6y7bAAAA9klEQVRIie3WwQ3CMBBA0R+N0LEkRgtHh4niG4nSEjSTjVhJSSsmVdkGFbwkMJKXjoYZprzvfszMTM6EdBrZ2gB9GbiEpjH0nExDZQV5K5JpRz5Sk28pux7pCLiZkBxyQH6KgQkG6pOglkwdyNHmMJY8rtRfnVJDwZobpQ1Fxq8RJWbBk5muvshYcQ7c3cnsFmBAmQk2Vg2gSOBGblJkPAZ6AQ0Za7sx9zGD/ID1L6+up/n0C0ZekNsZBBbErQ5kw4vGnbMMNafBMKRUJKuQQ3gG5GItUNOVLpcAAAAASUVORK5CYII=";

const bulletImg = new Image();
bulletImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAoCAYAAADPTXJXAAAAmUlEQVQ4je2UsQ3CMBBFJ6KAhJkHIi3hJSZRAjKYyCBBgTqZJlEAP1q7mVW3Xssz+tk+7EqewW+o1egO1io2qQaMZyAAsoMCiZosDbBbO6cc8oAF2h4FjAflCis5aE5EbkS5nRld4A7MxPMkfw1L74+Y3J7CMZnY1QHhUPrdUuK3aIPU1rjAJjAf7CXqKjY9pEN7SCL9P0H3DYONnoauUAAAAAElFTkSuQmCC";

const powerImg = new Image();
powerImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAsklEQVQ4je3UsQ2CQBAG4E9KG6BhA0lBRByQ/3MKQssTqEDZCEMZDFNHdZTMCiPYQQZJhtmfR0epYWJmkLRcZ9iGAQQQo3G+cwt5F5WySgrXkoL6gGXMQ7akX3URka0NfaERzNkAkG5iV40bnMCY3mJoZ8FF2exWrAIMpUKMdwd1qfZ/0AwkbkHcUMQPOXGgtTuM9uYl/Omp5hFs0pR1RTGhJErkcoAAAAASUVORK5CYII=";

// === Player ===
const player = {
  x: canvas.width/2 - 20,
  y: canvas.height - 80,
  w: 40, h: 40,
  speed: 5,
  lives: 3,
  power: 1
};

let score = 0;
let bullets = [];
let enemies = [];
let enemyBullets = [];
let powerups = [];
let keys = {};
let wave = 1;

// === Controls ===
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'u') {
    bullets.push({x: player.x+player.w/2-6, y: player.y-60, w:12, h:60, dy:-15, big:true});
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Auto fire
setInterval(() => {
  if (player.power === 1) {
    bullets.push({x: player.x+player.w/2-2, y: player.y, w:3, h:12, dy:-10});
  } else if (player.power === 2) {
    bullets.push({x: player.x+8, y: player.y, w:3, h:12, dy:-10});
    bullets.push({x: player.x+player.w-12, y: player.y, w:3, h:12, dy:-10});
  } else if (player.power >= 3) {
    bullets.push({x: player.x+5, y: player.y, w:3, h:12, dy:-10});
    bullets.push({x: player.x+player.w/2-2, y: player.y, w:3, h:12, dy:-10});
    bullets.push({x: player.x+player.w-8, y: player.y, w:3, h:12, dy:-10});
  }
}, 250);

// Enemy waves
function spawnWave(n) {
  for (let i=0; i<n; i++) {
    const type = Math.random()<0.5 ? 'zig' : 'straight';
    enemies.push({x:40+i*70, y:-40, w:30,h:30,dy:1+wave*0.2, type, alive:true, zigDir:1});
  }
}
setInterval(()=>{ spawnWave(4+wave); wave++; }, 5000);

// Enemy fire
function enemyFire(e) {
  enemyBullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:10,dy:3});
}

// === Update ===
function update() {
  if(keys['a']&&player.x>0) player.x-=player.speed;
  if(keys['d']&&player.x+player.w<canvas.width) player.x+=player.speed;
  if(keys['w']&&player.y>canvas.height/2) player.y-=player.speed;
  if(keys['s']&&player.y+player.h<canvas.height) player.y+=player.speed;

  bullets.forEach(b=>b.y+=b.dy);
  bullets=bullets.filter(b=>b.y>-40);

  enemyBullets.forEach(b=>b.y+=b.dy);
  enemyBullets=enemyBullets.filter(b=>b.y<canvas.height);

  enemies.forEach(e=>{
    if(!e.alive)return;
    e.y+=e.dy;
    if(e.type==='zig'){e.x+=e.zigDir*2; if(e.x<0||e.x+e.w>canvas.width) e.zigDir*=-1;}
    if(Math.random()<0.005) enemyFire(e);
  });
  enemies=enemies.filter(e=>e.alive&&e.y<canvas.height);

  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(e.alive && b.x<e.x+e.w && b.x+b.w>e.x && b.y<e.y+e.h && b.y+b.h>e.y){
        e.alive=false; b.y=-999; score+=10;
        if(Math.random()<0.2) powerups.push({x:e.x+e.w/2-10,y:e.y,w:20,h:20,dy:2});
      }
    });
  });

  enemyBullets.forEach(b=>{
    if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){
      b.y=canvas.height+1; player.lives--; 
      if(player.lives<=0){ alert('Game Over! Score:'+score); document.location.reload(); }
    }
  });

  powerups.forEach(p=>p.y+=p.dy);
  powerups=powerups.filter(p=>p.y<canvas.height);

  powerups.forEach(p=>{
    if(p.x<player.x+player.w&&p.x+p.w>player.x&&p.y<player.y+player.h&&p.y+p.h>player.y){
      p.y=canvas.height+1;
      if(player.power<3) player.power++;
    }
  });

  ui.textContent=`Score: ${score} | Lives: ${player.lives} | Power: ${player.power}`;
}

// === Draw ===
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(playerImg,player.x,player.y,player.w,player.h);
  bullets.forEach(b=>ctx.drawImage(bulletImg,b.x,b.y,b.w,b.h));
  ctx.fillStyle='yellow';
  enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  enemies.forEach(e=>{if(e.alive)ctx.drawImage(enemyImg,e.x,e.y,e.w,e.h);});
  powerups.forEach(p=>ctx.drawImage(powerImg,p.x,p.y,p.w,p.h));
}

// === Game Loop ===
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
