<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WinWing Clone</title>
  <style>
    body { margin:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:#111; }
    #ui { position:absolute; top:10px; left:10px; color:#fff; font:16px Arial; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="720"></canvas>
  <div id="ui">Score: 0 | Lives: 3</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');

    const player = {
      x: canvas.width/2 - 20,
      y: canvas.height - 80,
      w: 40,
      h: 40,
      speed: 5,
      lives: 3,
      upgradeLevel: 1
    };

    let score = 0;
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let keys = {};
    let wave = 1;

    // Controls
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;

      // Special shots
      if (e.key.toLowerCase() === 'b') {
        // twin wing lasers
        bullets.push({ x: player.x + 5, y: player.y, w:4, h:12, dy:-8, twin:true });
        bullets.push({ x: player.x + player.w - 9, y: player.y, w:4, h:12, dy:-8, twin:true });
      }
      if (e.key.toLowerCase() === 'u') {
        // ultimate beam
        bullets.push({ x: player.x + player.w/2 - 6, y: player.y - 60, w:12, h:60, dy:-15, big:true });
      }
    });
    document.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    // Auto fire normal bullets
    setInterval(() => {
      bullets.push({ x: player.x + player.w/2 -2, y: player.y, w:3, h:10, dy:-8, normal:true });
    }, 300);

    // Enemy spawn per wave
    function spawnWave(n) {
      for (let i = 0; i < n; i++) {
        // choose type
        const type = Math.random() < 0.5 ? 'zig' : 'straight';
        const ex = 40 + i * 80;
        enemies.push({
          x: ex,
          y: -40,
          w: 30,
          h: 30,
          dy: 1 + wave * 0.2,
          type: type,
          alive: true,
          // for zig movement
          zigDir: 1
        });
      }
    }

    // Enemy fire
    function enemyFire(enemy) {
      enemyBullets.push({
        x: enemy.x + enemy.w/2 -2,
        y: enemy.y + enemy.h,
        w:4,
        h:10,
        dy: 4
      });
    }

    // Spawn waves every few seconds
    let spawnInterval = setInterval(() => {
      spawnWave(5 + wave); // more enemies each wave
      wave++;
    }, 5000);

    // Update
    function update() {
      // Player move
      if (keys['a'] && player.x > 0) player.x -= player.speed;
      if (keys['d'] && player.x + player.w < canvas.width) player.x += player.speed;
      if (keys['w'] && player.y > canvas.height/2) player.y -= player.speed; // limit up movement
      if (keys['s'] && player.y + player.h < canvas.height) player.y += player.speed;

      // Bullets move
      bullets.forEach(b => b.y += b.dy);
      bullets = bullets.filter(b => b.y + b.h > 0);

      enemyBullets.forEach(b => b.y += b.dy);
      enemyBullets = enemyBullets.filter(b => b.y < canvas.height);

      // Enemies move
      enemies.forEach(e => {
        if (!e.alive) return;
        e.y += e.dy;
        if (e.type === 'zig') {
          e.x += e.zigDir * 2;
          if (e.x < 0 || e.x + e.w > canvas.width) e.zigDir *= -1;
        }
        // maybe fire occasionally
        if (Math.random() < 0.005) {
          enemyFire(e);
        }
      });
      enemies = enemies.filter(e => e.alive && e.y < canvas.height);

      // Collisions: player bullets vs enemies
      bullets.forEach(b => {
        enemies.forEach(e => {
          if (e.alive &&
            b.x < e.x + e.w && b.x + b.w > e.x &&
            b.y < e.y + e.h && b.y + b.h > e.y) {
            e.alive = false;
            b.y = -999;
            score += b.big ? 50 : b.twin ? 20 : 10;
          }
        });
      });

      // Collisions: enemy bullets vs player
      enemyBullets.forEach(b => {
        if (
          b.x < player.x + player.w &&
          b.x + b.w > player.x &&
          b.y < player.y + player.h &&
          b.y + b.h > player.y
        ) {
          // hit
          b.y = canvas.height + 1; // remove
          player.lives--;
          if (player.lives <= 0) {
            // game over
            alert('Game Over! Score: ' + score);
            // reset
            score = 0;
            wave = 1;
            player.lives = 3;
            enemies = [];
            bullets = [];
            enemyBullets = [];
          }
        }
      });

      // Update UI
      ui.textContent = `Score: ${score} | Lives: ${player.lives}`;
    }

    // Draw
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // Player
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Bullets
      ctx.fillStyle = '#ff4444';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Enemy bullets
      ctx.fillStyle = '#ffff00';
      enemyBullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Enemies
      ctx.fillStyle = '#44aaff';
      enemies.forEach(e => {
        if (e.alive) ctx.fillRect(e.x, e.y, e.w, e.h);
      });
    }

    // Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();

  </script>
</body>
</html>
