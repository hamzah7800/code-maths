<!DOCTYPE html>
<html style="width:100%;height:100%;background:black;">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>HZ MC – 120 FPS iPad Edition</title>

  <script>
  "use strict";
  window.eaglercraftXOpts = {
    demoMode:false,
    container:"game_frame",
    assetsURI:"assets.epk",
    localesURI:"lang/",
    worldsDB:"worlds",
    crashOnUncaughtExceptions:false,
    renderScale:0.5,            // crisp but light for iPad GPU
    maxParticles:0,             // none = best perf
    disableInstancedRendering:false,
    alwaysDisableTextureFiltering:true,
    reduceTextureQuality:true,
    textureAtlasSize:1024,
    fastMath:true,
    skipWorldUpdates:true,
    servers:[{addr:"ws://localhost:8081/",name:"Local"}],
    relays:[
      {addr:"wss://relay.deev.is/",primary:true},
      {addr:"wss://relay.lax1dude.net/"},
      {addr:"wss://relay.shhnowisnottheti.me/"}
    ]
  };
  </script>

  <script src="classes.js"></script>
</head>
<body id="game_frame" style="margin:0;width:100%;height:100%;overflow:hidden;background:black;">
<script>
"use strict";
window.addEventListener("load",()=>{
  if(typeof main==="function"){main();applyIpad120Hz();}else alert("main() missing");
});

function applyIpad120Hz(){
  if(!window.EaglercraftX){requestAnimationFrame(applyIpad120Hz);return;}
  const L=(...a)=>console.log("[HZMC-iPad]",...a);

  try{
    const s=window.EaglercraftX.settings||(window.EaglercraftX.settings={});
    s.graphics="fast";
    s.renderDistance=4;           // sweet spot for iPad 10th Gen
    s.entityRenderDistance=2;
    s.limitFramerate=0;           // uncapped internally
    s.smoothLighting=false;
    s.clouds=false;
    s.fog=false;
    s.particles="minimal";
    s.entityShadows=false;
    s.fancyLeaves=false;
    s.shaders=false;
    s.dynamicLights=false;
    s.useFXAA=false;
    s.mipmapLevels=0;
    s.anisotropicFiltering=false;
    s.showFPS=true;
  }catch(e){L("settings failed",e);}

  // ---------- Smooth frame pacing for 120 Hz ----------
  try{
    const eng=window.EaglercraftX;
    if(eng.__hzPacer) return; eng.__hzPacer=true;
    const STEP=1000/60;  // logic fixed at 60 Hz
    const FILTER=6;
    let last=performance.now(),acc=0,dtList=[];
    const tick=eng.tick||(()=>{}),render=eng.render||(()=>{});
    const call=(f,t)=>{try{f.call(eng,t);}catch(e){console.error(e);}};

    function loop(now){
      let d=now-last;if(d>1000)d=1000;last=now;acc+=d;
      while(acc>=STEP){call(tick,STEP/1000);acc-=STEP;}
      call(render,d/1000);
      dtList.push(d);if(dtList.length>FILTER)dtList.shift();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    L("120 Hz pacer active");
  }catch(e){L("pacer fail",e);}

  // ---------- Smooth chunk streaming ----------
  try{
    const cb=EaglercraftX.chunkBuilder;
    if(cb){
      cb.batchSize=1;             // build one per frame = smooth
      cb.maxAsyncTasks=1;
      cb.delay=0;                 // no idle gap
      L("chunkBuilder tuned");
    }
  }catch(e){L("chunk tune fail",e);}

  // ---------- Gentle async prefetch ----------
  try{
    const warm=()=>{if(window.EaglercraftX?.warmup)window.EaglercraftX.warmup();};
    for(let i=0;i<8;i++)requestAnimationFrame(warm);
  }catch{}

  // ---------- Adaptive FPS monitor (optional) ----------
  try{
    let last=performance.now(),frames=0,fps=0;
    const label=document.createElement("div");
    label.style="position:fixed;top:5px;right:8px;color:#0f0;font:12px monospace;z-index:9999;pointer-events:none;";
    document.body.append(label);
    function fpsLoop(t){
      frames++;if(t-last>=1000){fps=frames;frames=0;last=t;label.textContent=fps+" fps";}
      requestAnimationFrame(fpsLoop);
    }
    requestAnimationFrame(fpsLoop);
  }catch{}
}
</script>
</body>
</html>
