<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta name="description" content="HZ MC - Ultra Potato (no particles, minimal GPU work)"/>
  <meta name="keywords" content="eaglercraft,minecraft,oneblock,potato,performance,ultra,low" />
  <title>HZ MC - Ultra Potato</title>
  <link rel="shortcut icon" type="image/png" href="favicon.png" />

  <script>
    "use strict";
    // -------------------- HZ MC - ULTRA POTATO CONFIG --------------------
    // All particles removed, minimal textures, instancing enabled, uncapped rendering.
    window.eaglercraftXOpts = {
      demoMode: false,
      container: "game_frame",
      assetsURI: "assets.epk",
      localesURI: "lang/",
      worldsDB: "worlds",
      logInvalidCerts: false,
      crashOnUncaughtExceptions: false,

      // MAX PERFORMANCE - potato visuals
      renderScale: 0.20,              // very low render resolution (fast)
      minRenderScale: 0.10,          // allow fallback if perf drops
      maxParticles: 0,               // NO PARTICLES
      disableInstancedRendering: false, // enable instancing for less CPU
      smoothGui: false,

      // World behavior
      skipWorldUpdates: true,        // skip non-critical world ticks
      fastMath: true,                // faster math where supported

      // Textures / filtering
      alwaysDisableTextureFiltering: true, // nearest-neighbor
      textureAtlasSize: 512,
      textureUpdatesPerFrame: 1,
      reduceTextureQuality: true,

      // servers (keep)
      servers: [{ addr: "ws://localhost:8081/", name: "Local OneBlock Server" }],
      relays: [
        { addr: "wss://relay.deev.is/", comment: "relay #1", primary: true },
        { addr: "wss://relay.lax1dude.net/", comment: "relay #2" },
        { addr: "wss://relay.shhnowisnottheti.me/", comment: "relay #3" }
      ]
    };
  </script>

  <script type="text/javascript" src="classes.js"></script>
</head>
<body id="game_frame" style="margin:0;width:100%;height:100%;overflow:hidden;background-color:black;">
  <script>
    "use strict";

    // Start engine then apply ultra-potato patches
    window.addEventListener("load", function() {
      if (typeof main === "function") {
        try { main(); console.log("✅ HZ MC engine started."); } catch (e) { console.error("main() error:", e); }
        applyUltraPotatoPatches();
      } else {
        alert("ERROR: main() not found in classes.js");
      }
    });

    // Ultra Potato: absolutely minimal visuals, no particles, aggressive culling & streaming
    function applyUltraPotatoPatches() {
      if (!window.EaglercraftX) { requestAnimationFrame(applyUltraPotatoPatches); return; }
      const LOG = (...a) => console.log("[HZ MC UltraPotato]", ...a);
      LOG("Applying Ultra Potato patches...");

      // 1) Force minimal settings (non-destructive)
      try {
        const s = window.EaglercraftX.settings || (window.EaglercraftX.settings = {});
        s.graphics = "fast";
        s.renderDistance = 2;           // small geometry load (keeps draw calls low)
        s.entityRenderDistance = 0;     // avoid rendering distant entities
        s.limitFramerate = 0;           // uncapped - let browser/hardware decide
        s.showFPS = true;

        // Turn everything visual off
        s.smoothLighting = false;
        s.clouds = false;
        s.particles = "off";            // engine-level particle off
        s.entityShadows = false;
        s.fancyLeaves = false;
        s.useFXAA = false;
        s.dynamicLights = false;
        s.shaders = false;
        s.fog = false;
        s.mipmapLevels = 0;
        s.anisotropicFiltering = false;
        s.textureUpdatesPerFrame = 1;
        s.reduceTextureQuality = true;

        // Ensure opts reflect no particles etc.
        if (window.eaglercraftXOpts) {
          window.eaglercraftXOpts.maxParticles = 0;
          window.eaglercraftXOpts.alwaysDisableTextureFiltering = true;
          window.eaglercraftXOpts.disableInstancedRendering = false;
        }

        LOG("Graphics forced to ULTRA POTATO.");
      } catch (e) {
        LOG("Error forcing graphics:", e);
      }

      // 2) Aggressive draw & chunk culling (best-effort, non-invasive)
      try {
        const engine = window.EaglercraftX;
        if (engine.chunkCache) {
          // keep chunk cache but encourage minimal visible area by setting small radius
          try { engine.chunkCache.maxVisibleChunks = 9; } catch(e){}
        }

        // If renderer has chunk draw hook wrap it to minimize work
        if (engine.renderer && typeof engine.renderer.drawChunks === "function") {
          const orig = engine.renderer.drawChunks.bind(engine.renderer);
          engine.renderer.drawChunks = function() {
            // Temporarily reduce detail flags if present
            const prevLOD = this._forcedLOD;
            try {
              this._forcedLOD = this._forcedLOD !== undefined ? Math.max(2, this._forcedLOD) : 2;
              return orig();
            } finally {
              this._forcedLOD = prevLOD;
            }
          };
          LOG("Renderer drawChunks wrapped for lower LOD.");
        }
      } catch (e) {
        LOG("Draw culling patch error:", e);
      }

      // 3) Disable all particle systems at runtime (best-effort)
      try {
        const FX = window.EaglercraftX.particleSystem;
        if (FX) {
          if (Array.isArray(FX.emitters)) {
            FX.emitters.length = 0;
          }
          if (typeof FX.clear === "function") FX.clear();
        }
        // Also try global engine particle arrays
        try { if (window.EaglercraftX.particles) window.EaglercraftX.particles = []; } catch(e){}
        LOG("Runtime particle systems wiped/disabled (best-effort).");
      } catch (e) {
        LOG("Particle disabling failed:", e);
      }

      // 4) Chunk builder: smooth but aggressive streaming (small batches so no big freeze)
      try {
        const cb = window.EaglercraftX.chunkBuilder;
        if (cb) {
          if (typeof cb.batchSize !== "undefined") cb.batchSize = 1;
          if (typeof cb.maxAsyncTasks !== "undefined") cb.maxAsyncTasks = 2;
          if (typeof cb.buildNext === "function") {
            const realBuild = cb.buildNext.bind(cb);
            cb.buildNext = function() {
              // run one small build per call to avoid spike
              try { return realBuild(); } catch(e){ try { return realBuild(); } catch(e2){} }
            };
          }
          LOG("Chunk builder tuned to small streaming batches (fast, low spike).");
        }
      } catch (e) {
        LOG("Chunk builder tuning failed:", e);
      }

      // 5) Frame pacer: uncapped rendering via rAF plus extremely light game logic updates
      try {
        const engine = window.EaglercraftX;
        if (!engine.__hzmcPacerInstalled) {
          engine.__hzmcPacerInstalled = true;

          const LOG2 = LOG;
          const TARGET_LOGIC_STEP = 1000 / 20; // 20 TPS logic to minimize CPU
          const MAX_STEPS = 3;
          let last = performance.now();
          let acc = 0;

          const origTick = engine.tick || function(){};
          const origRender = engine.render || function(){};

          function safe(fn, ...args) {
            try { if (typeof fn === "function") return fn.apply(engine, args); }
            catch(e) { console.error("[HZMC] wrapped error:", e); }
          }

          function loop(now) {
            let delta = now - last;
            if (delta > 1000) delta = 1000;
            last = now;
            acc += delta;
            if (acc > TARGET_LOGIC_STEP * MAX_STEPS) acc = TARGET_LOGIC_STEP * MAX_STEPS;

            let steps = 0;
            while (acc >= TARGET_LOGIC_STEP && steps < MAX_STEPS) {
              safe(origTick, TARGET_LOGIC_STEP / 1000);
              acc -= TARGET_LOGIC_STEP;
              steps++;
            }

            // Render every rAF call (uncapped by engine), minimal work inside render
            safe(origRender, delta / 1000);

            // Continue
            requestAnimationFrame(loop);
          }
          requestAnimationFrame((t) => { last = t || performance.now(); requestAnimationFrame(loop); });
          LOG2("HZ MC pacer installed (render uncapped via rAF, logic ~20TPS).");
        }
      } catch (e) {
        LOG("Pacer install error:", e);
      }

      // 6) Performance monitor with hard fallback to ultra-low renderScale
      try {
        const monitor = { samples: [], size: 30, lastCheck: performance.now(), interval: 2000 };
        function monitorTick() {
          const now = performance.now();
          monitor.samples.push(1000 / Math.max(1, now - (monitor.prev || now)));
          if (monitor.samples.length > monitor.size) monitor.samples.shift();
          monitor.prev = now;

          if (now - monitor.lastCheck >= monitor.interval) {
            monitor.lastCheck = now;
            const avg = monitor.samples.reduce((a,b)=>a+b,0) / monitor.samples.length;
            if (avg < 30 && window.eaglercraftXOpts && window.eaglercraftXOpts.renderScale > window.eaglercraftXOpts.minRenderScale) {
              const old = window.eaglercraftXOpts.renderScale;
              window.eaglercraftXOpts.renderScale = Math.max(window.eaglercraftXOpts.minRenderScale || 0.10, old - 0.05);
              LOG("Perf fallback: lowered renderScale", old, "->", window.eaglercraftXOpts.renderScale);
              try { if (typeof window.EaglercraftX.applySettings === "function") window.EaglercraftX.applySettings(); } catch(e){}
            }
            if (avg > 120 && window.eaglercraftXOpts && window.eaglercraftXOpts.renderScale < 0.25) {
              // cautiously bump up if perf is great
              window.eaglercraftXOpts.renderScale = Math.min(0.25, window.eaglercraftXOpts.renderScale + 0.02);
              LOG("Perf good: increased renderScale to", window.eaglercraftXOpts.renderScale);
              try { if (typeof window.EaglercraftX.applySettings === "function") window.EaglercraftX.applySettings(); } catch(e){}
            }
          }
          requestAnimationFrame(monitorTick);
        }
        requestAnimationFrame(monitorTick);
        LOG("Performance monitor active (hard fallback enabled).");
      } catch (e) {
        LOG("Performance monitor error:", e);
      }

      LOG("✅ Ultra Potato patches applied: particles OFF, minimal visuals, fast streaming.");
      LOG("NOTE: browser refresh rate / rAF limit may cap observed FPS; this maximizes engine-side throughput.");
    }
  </script>
</body>
</html>
