<html style="width:100%; height:100%; background-color:black;">
<head>
    <meta charset="UTF-8" />

    <title>EaglercraftX High-FPS</title>

    <style>
        /*
         * *** THE PRIMARY FPS BOOST FIX ***
         * This CSS downscales the canvas resolution, reducing the GPU load significantly.
         * The 'image-rendering' property ensures it looks crisp (pixelated) instead of blurry.
         */
        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 100;
        }

        /* Essential for full screen, zero margin */
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
    </style>

    <script type="text/javascript">
        // ** (OPTIONAL) Advanced Performance Tweak via eaglercraftOpts **
        // This is where you can force certain client options on startup.

            // 0.5 means a 50% scale, 0.75 means 75% scale.

            // Disable features like motion blur, which can impact performance
            'noBloom': true,
            'noDOF': true,
            'noVignette': true,
            'noAntialiasing': true
        };
    </script>
