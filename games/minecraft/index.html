<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;background:black;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="description" content="HZ OneBlock Client Ultra FPS">
  <meta name="keywords" content="eaglercraft, minecraft, oneblock, ultra fps, 1.8">
  <title>HZ OneBlock Adaptive Ultra FPS</title>
  <link rel="shortcut icon" href="favicon.png" type="image/png">

  <script>
    "use strict";

    /*-------------------------
      ⚙️  Base Game Options
    -------------------------*/
    window.eaglercraftXOpts = {
      demoMode: false,
      container: "game_frame",
      assetsURI: "assets.epk",
      localesURI: "lang/",
      worldsDB: "worlds",
      logInvalidCerts: false,
      crashOnUncaughtExceptions: false,
      maxParticles: 30,
      disableInstancedRendering: true,
      smoothGui: false,
      renderScale: 0.5,
      servers: [
        { addr: "ws://localhost:8081/", name: "Local OneBlock Server" }
      ],
      relays: [
        { addr: "wss://relay.deev.is/", comment: "relay #1", primary: true },
        { addr: "wss://relay.lax1dude.net/", comment: "relay #2" },
        { addr: "wss://relay.shhnowisnottheti.me/", comment: "relay #3" }
      ]
    };
  </script>

  <script src="classes.js"></script>
</head>
<body id="game_frame" style="margin:0;width:100%;height:100%;overflow:hidden;background:black;">

<script>
"use strict";

/*-------------------------
  🚀 Game Startup
-------------------------*/
window.addEventListener("load", () => {
  if (typeof main === "function") {
    requestAnimationFrame(main);
    console.log("✅ Game started with Adaptive Ultra FPS");
  } else {
    alert("ERROR: main() not found in classes.js");
  }
});

/*-------------------------
  ⚡ Adaptive Ultra FPS
-------------------------*/
(() => {
  const log = (...a) => console.log("[UltraFPS]", ...a);

  // 🕵️ Simple performance detector
  function detectPerformance(cb) {
    let frames = 0, start = performance.now();
    (function frame() {
      frames++;
      if (performance.now() - start < 150) requestAnimationFrame(frame);
      else {
        const fps = frames * 6.6; // estimate from 150ms
        cb(fps > 900 ? 0 : (fps > 120 ? 240 : 120));
      }
    })();
  }

  // 🔁 Patch main loop with intelligent limiter
  function patchLoop(maxFPS) {
    const game = window.EaglercraftX;
    if (!game?.mainLoop || window._ultraFPS_loop) return;
    const oldLoop = game.mainLoop.bind(game);

    let nextFrame = 0, delay = maxFPS ? 1000 / maxFPS : 0;

    function loop(now = performance.now()) {
      try { oldLoop(); } catch {}
      const elapsed = performance.now() - now;
      const wait = Math.max(0, delay - elapsed);
      setTimeout(loop, wait);
    }

    game.mainLoop = loop;
    window._ultraFPS_loop = true;
    log(maxFPS ? `Capped at ${maxFPS} FPS` : "Uncapped (turbo mode)");
  }

  // 🧩 Graphics optimizer
  function patchGraphics() {
    const s = window.EaglercraftX?.settings;
    if (!s || window._ultraFPS_gfx) return;

    Object.assign(s, {
      useFXAA: false,
      dynamicLights: false,
      renderDistance: 2,
      smoothLighting: false,
      clouds: false,
      particles: "minimal",
      graphics: "fast",
      entityShadows: false,
      mipmapLevels: 0,
      ao: false
    });

    window._ultraFPS_gfx = true;
    log("Graphics optimized for performance");
  }

  // ⛏️ Async chunk builder
  function patchChunkBuilder() {
    const cb = window.EaglercraftX?.chunkBuilder;
    if (!cb?.buildNext || window._ultraFPS_chunk) return;

    const original = cb.buildNext.bind(cb);
    cb.buildNext = () => queueMicrotask(original);
    window._ultraFPS_chunk = true;
    log("Chunk builder async optimized");
  }

  // 🔄 Wait for engine readiness
  const interval = setInterval(() => {
    if (window.EaglercraftX && typeof main === "function") {
      clearInterval(interval);
      log("Applying Ultra FPS optimizations...");
      patchGraphics();
      patchChunkBuilder();
      detectPerformance(patchLoop);
    }
  }, 100);
})();
</script>
</body>
</html>
