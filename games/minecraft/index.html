<script>
"use strict";
// 1. Start Main Function
window.addEventListener("load",()=>{if(typeof main=="function"){main()}else{console.error("ERROR: main() not found")}});

// 2. Optimization Logic (Minified)
(()=>{
// P: Poll for EaglercraftX availability
const P=(f,c,i=25)=>{const t=setInterval(()=>{try{if(f()){clearInterval(t);c()}}catch(e){}},i);};

// pL: Patch Loop for ULTIMATE UNCAP FPS
const pL=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.mainLoop||window._uFPS_l) return;
    const l=window.EaglercraftX.mainLoop.bind(window.EaglercraftX);
    const loop=()=>{try{l()}catch(e){}};
    // Uncapped FPS for max raw speed
    window.EaglercraftX.mainLoop=()=>setTimeout(loop,0);
    window._uFPS_l=1;
};

// pG: Patch Graphics (Enforce lowest quality and MINIMUM RENDER DISTANCE)
const pG=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.settings||window._uFPS_g) return;
    let s=window.EaglercraftX.settings;
    // Disable all expensive effects
    s.useFXAA=s.dynamicLights=s.smoothLighting=s.clouds=s.ao=s.entityShadows=!1;
    // Set LOWEST settings
    s.renderDistance=1; // CRITICAL: Min render distance to reduce chunk count
    s.particles="minimal";s.graphics="fast";s.mipmapLevels=0;
    window._uFPS_g=1;
};

// pC: Patch Chunk Builder for AGGRESSIVE PRE-BUILDING
const pC=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.chunkBuilder||window._uFPS_c) return;
    const c=window.EaglercraftX.chunkBuilder;
    if(typeof c.buildNext!=="function") return;
    const o=c.buildNext.bind(c);
    // Aggressive off-thread chunk building
    c.buildNext=()=>setTimeout(o,0);
    window._uFPS_c=1;
};

// pTICK: NEW Patch to reduce the CPU-intensive game logic update rate (Client Side)
const pTICK=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.settings||window._uFPS_tck) return;
    // CRITICAL: Force the target client tick rate down to the minimum 20 TPS (Server speed)
    // This reduces the game logic calculations per second on the CPU, reducing lag spikes.
    window.EaglercraftX.settings.framerateLimit=20; 
    window.EaglercraftX.settings.limitFramerate=!0; // Re-enable limit to apply setting
    window._uFPS_tck=1;
};

// pCHUNK_UNLOAD: NEW Patch to aggressively unload chunks to reduce memory/VRAM usage
const pCHUNK_UNLOAD=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.getWorld||window._uFPS_u) return;
    
    // Check and aggressively unload chunks every 2 seconds
    setInterval(()=>{
        try {
            const world = window.EaglercraftX.getWorld();
            if (world && typeof world.checkChunkCache === 'function') {
                // Forcing the game to check and potentially unload chunks outside render distance
                world.checkChunkCache();
            }
        } catch (e) {
            // Ignore errors if the world is null or functions are missing
        }
    }, 2000); 
    
    window._uFPS_u=1;
};

// pGC: Patch for Aggressive Garbage Collection (Reduces mobile stutters)
const pGC=()=>{
    // Attempt to run garbage collection periodically (every 5 seconds)
    if (typeof window.gc === 'function') {
        setInterval(() => {
            try {
                window.gc();
            } catch (e) {}
        }, 5000); 
    }
};

// pT: Patch Texture Preload (Ensure textures are loaded early)
const pT=()=>{
    if(!window.EaglercraftX||!window.EaglercraftX.textureManager||window._uFPS_t) return;
    try{
        const t=window.EaglercraftX.textureManager;
        if(typeof t.loadAll==="function"){t.loadAll()}
    }catch(e){}
    window._uFPS_t=1;
};

// Apply all patches once the engine is ready
P(()=>window.EaglercraftX&&typeof main=="function",()=>{
    pGC();           // 1. Memory Cleanup
    pG();            // 2. Lowest Graphics & Min Render Distance (RD=1)
    pTICK();         // 3. Lower Client Update Rate (20 TPS)
    pC();            // 4. Aggressive Chunk Pre-building
    pCHUNK_UNLOAD(); // 5. Aggressive Chunk Unloading
    pL();            // 6. Uncapped FPS Loop
});
})();
