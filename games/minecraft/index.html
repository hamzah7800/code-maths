<html style="width:100%;height:100%;background-color:black;">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="description" content="EaglercraftX OneBlock Ultra FPS Client"><meta name="keywords" content="eaglercraft, minecraft, oneblock, 1.8, fps"><title>HZ OneBlock Ultra FPS</title><link type="image/png" rel="shortcut icon" href="favicon.png">

<script>
"use strict";
window.eaglercraftXOpts={demoMode:!1,container:"game_frame",assetsURI:"assets.epk",localesURI:"lang/",worldsDB:"worlds",logInvalidCerts:!1,crashOnUncaughtExceptions:!1,maxParticles:50,disableInstancedRendering:!0,smoothGui:!1,renderScale:.5,servers:[{addr:"ws://localhost:8081/",name:"Local OneBlock Server"}],relays:[{addr:"wss://relay.deev.is/",comment:"relay #1",primary:!0},{addr:"wss://relay.lax1dude.net/",comment:"relay #2"},{addr:"wss://relay.shhnowisnottheti.me/",comment:"relay #3"}]};

<script type="text/javascript" src="classes.js"></script>
</head>
<body style="margin:0;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
<script>
"use strict";
window.addEventListener("load",()=>{if(typeof main=="function"){main();console.log("✅ Game started with Ultra FPS optimizations")}else{console.error("ERROR: main() not found")}});
(()=>{
const L=console.log,
poll=(fn,cb,i=50)=>{
const t=setInterval(()=>{
try{if(fn()){clearInterval(t);cb()}}catch(e){}
},i);
};
function detect(cb){
let c=0;
const s=performance.now();
const test=()=>{
c++;
if(performance.now()-s<10){requestAnimationFrame(test)}
else{cb(c/((performance.now()-s)/1000)>500?0:240)}
};
requestAnimationFrame(test);
}
function patchLoop(m){
if(!window.EaglercraftX||!window.EaglercraftX.mainLoop||window._uFPS_l) return;
const oldLoop=window.EaglercraftX.mainLoop.bind(window.EaglercraftX);
const loop=()=>{try{oldLoop()}catch(e){}};
window.EaglercraftX.mainLoop=m>0?()=>setTimeout(loop,1000/m):()=>setTimeout(loop,0);
window._uFPS_l=1;
L(`[uFPS] Loop ${m>0?`capped at ${m} FPS`:"uncapped"}`);
}
function patchGraphics(){
if(!window.EaglercraftX||!window.EaglercraftX.settings||window._uFPS_g) return;
let s=window.EaglercraftX.settings;
s.useFXAA=s.dynamicLights=s.smoothLighting=s.clouds=s.ao=s.entityShadows=!1;
s.renderDistance=2;s.particles="minimal";s.graphics="fast";s.mipmapLevels=0;
window._uFPS_g=1;
L("[uFPS] Graphics set to minimum");
}
function patchChunkBuilder(){
if(!window.EaglercraftX||!window.EaglercraftX.chunkBuilder||window._uFPS_c) return;
const cb=window.EaglercraftX.chunkBuilder;
if(typeof cb.buildNext!=="function") return;
const old=cb.buildNext.bind(cb);
cb.buildNext=()=>setTimeout(old,1);
window._uFPS_c=1;
L("[uFPS] Chunk builder patched for lazy async loading");
}
poll(()=>window.EaglercraftX && typeof main=="function",()=>{
L("[uFPS] Applying patches...");
patchGraphics();
patchChunkBuilder();
detect(patchLoop);
});
})();
</script>
</body>
</html>
