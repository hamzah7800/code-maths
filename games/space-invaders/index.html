<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Space Invaders Ultimate</title>
  <style>
    html,body {
      margin:0; padding:0; background:#000; overflow:hidden;
    }
    canvas {
      display:block;
      width:100vw;
      height:100vh;
      background:#001;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute; top:10px; left:10px;
      font-family:monospace; color:white;
    }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="ui">
    Score: <span id="score">0</span> — Lives: <span id="lives">3</span> — Press <b>U</b> for Ultimate
  </div>
  <canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const W = () => canvas.width, H = () => canvas.height;

  let keys = {}, score = 0, lives = 3, gameOver = false;

  const player = { w:60, h:16, x: W()/2-30, y: H()-60, speed: 320, bullets:[], ultimate:false, ultiTimer:0 };

  const rows = 5, cols = 10;
  let enemies = [];
  let enemyDir = 1, enemySpeed = 40, enemyDropY = 30, enemyTimer = 0;

  function resetEnemies(){
    enemies = [];
    const spacingX=64, spacingY=48, startX=80, startY=80;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        enemies.push({ x: startX + c*spacingX, y: startY + r*spacingY, r: 18, alive: true });
      }
    }
  }

  let enemyBullets = [];
  function spawnEnemyBullet(e){
    enemyBullets.push({ x: e.x, y: e.y+14, vy: 200 });
  }

  // Input
  window.addEventListener('keydown', e=> keys[e.code]=true);
  window.addEventListener('keyup', e=> keys[e.code]=false);

  function firePlayer(){
    if(player.bullets.length < 5){
      player.bullets.push({ x: player.x + player.w/2, y: player.y-8, vy: -600, r: 10 });
    }
  }

  function rectCircleCollision(rx,ry,rw,rh,cx,cy,cr){
    const nearestX = Math.max(rx, Math.min(cx, rx+rw));
    const nearestY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - nearestX, dy = cy - nearestY;
    return dx*dx + dy*dy <= cr*cr;
  }

  resetEnemies();

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    if(!gameOver) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    // move player
    if(keys['ArrowLeft']) player.x -= player.speed * dt;
    if(keys['ArrowRight']) player.x += player.speed * dt;
    player.x = Math.max(8, Math.min(W() - player.w - 8, player.x));
    if(keys['Space'] && !keys._spacePrev){ firePlayer(); }
    keys._spacePrev = !!keys['Space'];

    // activate ultimate
    if(keys['KeyU'] && !player.ultimate){
      player.ultimate = true;
      player.ultiTimer = 0.6; // beam lasts 0.6s
    }

    // bullets
    player.bullets.forEach(b => b.y += b.vy*dt);
    player.bullets = player.bullets.filter(b => b.y > -10);
    enemyBullets.forEach(b => b.y += b.vy*dt);

    // enemies movement
    enemyTimer += dt;
    const stepInterval = Math.max(0.15, 0.9 - score*0.01);
    if(enemyTimer > stepInterval){
      enemyTimer = 0;
      const xs = enemies.filter(e=>e.alive).map(e=>e.x);
      if(xs.length){
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        if(maxX + 20 >= W()-8 && enemyDir === 1){ enemyDir = -1; enemies.forEach(e=>e.y += enemyDropY); }
        else if(minX - 20 <= 8 && enemyDir === -1){ enemyDir = 1; enemies.forEach(e=>e.y += enemyDropY); }
      }
      enemies.forEach(e => { if(e.alive) e.x += enemyDir * enemySpeed; });
      if(Math.random() < 0.4){
        const alive = enemies.filter(e=>e.alive);
        if(alive.length) spawnEnemyBullet(alive[Math.floor(Math.random()*alive.length)]);
      }
    }

    // bullets vs enemies
    player.bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(e.alive && rectCircleCollision(e.x-e.r, e.y-e.r, e.r*2, e.r*2, b.x, b.y, b.r*1.5)){
          e.alive = false;
          b._dead = true;
          score += 10;
        }
      });
    });
    player.bullets = player.bullets.filter(b=>!b._dead);

    // enemy bullets vs player
    enemyBullets.forEach(b=>{
      if(rectCircleCollision(player.x, player.y, player.w, player.h, b.x, b.y, 8)){
        b._dead = true;
        lives--;
        if(lives<=0) gameOver=true;
      }
    });
    enemyBullets = enemyBullets.filter(b=>!b._dead && b.y < H()+20);

    // ultimate beam logic
    if(player.ultimate){
      player.ultiTimer -= dt;
      enemies.forEach(e=>{
        if(e.alive && Math.abs(e.x - (player.x+player.w/2)) < 40){
          e.alive = false;
          score += 20;
        }
      });
      if(player.ultiTimer <= 0){
        player.ultimate = false;
      }
    }

    // enemies reach bottom
    for(const e of enemies){
      if(e.alive && e.y + e.r*2 >= player.y){ lives = 0; gameOver = true; break; }
    }

    if(enemies.every(e=>!e.alive)){ resetEnemies(); enemySpeed += 8; }

    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  function draw(){
    ctx.clearRect(0,0,W(),H());
    ctx.fillStyle = '#00131f';
    ctx.fillRect(0,0,W(),H());

    // player
    ctx.fillStyle = '#6ff';
    roundRect(ctx, player.x, player.y, player.w, player.h, 6, true, false);

    // bullets
    ctx.fillStyle = '#fff';
    for(const b of player.bullets){
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }

    // enemies
    enemies.forEach(e=>{
      if(!e.alive) return;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = '#f66';
      ctx.beginPath();
      ctx.arc(0, -2, e.r-2, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#f88';
      ctx.fillRect(-e.r, -2, e.r*2, e.r);
      ctx.fillStyle = '#000';
      ctx.fillRect(-6, -2, 3, 4);
      ctx.fillRect(3, -2, 3, 4);
      ctx.restore();
    });

    // enemy bullets
    ctx.fillStyle = '#ffa';
    for(const b of enemyBullets){
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
    }

    // ultimate beam
    if(player.ultimate){
      const cx = player.x + player.w/2;
      const grad = ctx.createLinearGradient(cx, 0, cx, H());
      grad.addColorStop(0, 'rgba(0,255,255,0.2)');
      grad.addColorStop(1, 'rgba(0,255,255,0.6)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx-25, 0, 50, H());
      // glow
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 40;
      ctx.fillRect(cx-15, 0, 30, H());
      ctx.shadowBlur = 0;
    }

    // HUD / game over
    if(gameOver){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(W()/2-150, H()/2 - 60, 300, 120);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '28px monospace';
      ctx.fillText('GAME OVER', W()/2, H()/2 - 8);
      ctx.font = '16px monospace';
      ctx.fillText('Press F5 to restart', W()/2, H()/2 + 24);
    }
  }

  function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    if (typeof stroke === 'undefined') stroke = true;
    if (typeof r === 'undefined') r = 5;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
