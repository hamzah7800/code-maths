<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Space Invaders — HTML5 Canvas</title>
  <style>
    html,body {
      height:100%; margin:0; background:#000; color:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    canvas {
      background: #001; display:block;
      border:4px solid #044;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute; top:10px; left:10px;
      font-family:monospace;
    }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="ui">
    Score: <span id="score">0</span> — Lives: <span id="lives">3</span>
  </div>
  <canvas id="game" width="480" height="560"></canvas>

  <!-- load the external JS -->
  <script src="game.js"></script>
</body>
</html>
