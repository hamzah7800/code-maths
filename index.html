
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Parkour Game</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <!-- Cannon.js physics engine -->
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
  <script>
    // Make cannon global so Babylon.js can see it
    window.CANNON = window.CANNON || cannon;
  </script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    
    const createScene = () => {
      const scene = new BABYLON.Scene(engine);

      // Camera
      const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0,5,-10), scene);
      camera.attachControl(canvas, true);
      camera.speed = 0.5;

      // Light
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);

      // Physics
      scene.enablePhysics(new BABYLON.Vector3(0,-9.81,0), new BABYLON.CannonJSPlugin());

      // Ground
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:50, height:50}, scene);
      ground.position.y = 0;
      ground.physicsImpostor = new BABYLON.PhysicsImpostor(
        ground,
        BABYLON.PhysicsImpostor.BoxImpostor,
        { mass: 0, restitution: 0.1, friction: 1 },
        scene
      );

      // Player (cube)
      const player = BABYLON.MeshBuilder.CreateBox("player", {size:1}, scene);
      player.position.y = 1;
      player.physicsImpostor = new BABYLON.PhysicsImpostor(
        player,
        BABYLON.PhysicsImpostor.BoxImpostor,
        { mass: 1, restitution: 0, friction: 0.5 },
        scene
      );

      // Simple obstacles
      const obstacles = [];
      for(let i=0; i<10; i++){
        const box = BABYLON.MeshBuilder.CreateBox("obs"+i, {width:2, height:2, depth:2}, scene);
        box.position.set(i*4,1,Math.random()*10-5);
        box.physicsImpostor = new BABYLON.PhysicsImpostor(
          box,
          BABYLON.PhysicsImpostor.BoxImpostor,
          { mass: 0, restitution: 0.1, friction: 1 },
          scene
        );
        obstacles.push(box);
      }

      // Simple keyboard movement
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, e => inputMap[e.sourceEvent.key] = true));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, e => inputMap[e.sourceEvent.key] = false));

      scene.onBeforeRenderObservable.add(() => {
        const force = 5;
        if(inputMap["w"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,0,force), player.getAbsolutePosition());
        if(inputMap["s"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,0,-force), player.getAbsolutePosition());
        if(inputMap["a"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(-force,0,0), player.getAbsolutePosition());
        if(inputMap["d"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(force,0,0), player.getAbsolutePosition());
        if(inputMap[" "]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,5,0), player.getAbsolutePosition()); // jump
      });

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
