<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Parkour Game</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
<style>
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script>
  // Get canvas and create engine
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);

  const createScene = function () {
    const scene = new BABYLON.Scene(engine);

    // Physics
    const gravityVector = new BABYLON.Vector3(0, -9.81, 0);
    const physicsPlugin = new BABYLON.CannonJSPlugin();
    scene.enablePhysics(gravityVector, physicsPlugin);

    // Camera
    const camera = new BABYLON.FreeCamera("camera", new BABYLON.Vector3(0, 2, -10), scene);
    camera.attachControl(canvas, true);
    camera.speed = 0.3;

    // Light
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.9;

    // Ground
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:20, height:20}, scene);
    ground.physicsImpostor = new BABYLON.PhysicsImpostor(ground, BABYLON.PhysicsImpostor.BoxImpostor, {mass:0, restitution:0.1}, scene);

    // Player cube
    const player = BABYLON.MeshBuilder.CreateBox("player", {height:1, width:1, depth:1}, scene);
    player.position.y = 2;
    player.physicsImpostor = new BABYLON.PhysicsImpostor(player, BABYLON.PhysicsImpostor.BoxImpostor, {mass:1, restitution:0}, scene);

    // Platforms
    const platforms = [];
    for(let i=0;i<10;i++){
      const p = BABYLON.MeshBuilder.CreateBox("plat"+i, {height:0.5, width:3, depth:3}, scene);
      p.position.set(i*4, Math.random()*2+1, Math.random()*4 -2);
      p.physicsImpostor = new BABYLON.PhysicsImpostor(p, BABYLON.PhysicsImpostor.BoxImpostor, {mass:0, restitution:0.1}, scene);
      platforms.push(p);
    }

    // Player movement
    const inputMap = {};
    scene.actionManager = new BABYLON.ActionManager(scene);
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, function(evt){
      inputMap[evt.sourceEvent.key] = true;
    }));
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, function(evt){
      inputMap[evt.sourceEvent.key] = false;
    }));

    scene.onBeforeRenderObservable.add(()=>{
      const force = 10;
      if(inputMap["w"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,0,force), player.getAbsolutePosition());
      if(inputMap["s"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,0,-force), player.getAbsolutePosition());
      if(inputMap["a"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(-force,0,0), player.getAbsolutePosition());
      if(inputMap["d"]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(force,0,0), player.getAbsolutePosition());
      if(inputMap[" "]) player.physicsImpostor.applyImpulse(new BABYLON.Vector3(0,5,0), player.getAbsolutePosition());
    });

    return scene;
  };

  const scene = createScene();

  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener("resize", ()=>{
    engine.resize();
  });
</script>
</body>
</html>
